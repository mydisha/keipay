      operationId: deleteWebhookEndpoint
      summary: Delete a webhook endpoint
      x-keipay-permission: apps:write
      security:
        - adminSession: []
          csrfToken: []
      description: |
        Soft-deletes the endpoint: it stops receiving events at once and
        disappears from lists, while its past deliveries stay readable.
        Pending deliveries to it end `FAILED` without another attempt.
        Deleting a deleted endpoint returns `404 not_found`. Records
        `webhook_endpoint.delete`.
      parameters:
        - $ref: '#/components/parameters/WebhookEndpointIdPath'
      responses:
        '204':
          description: Deleted.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /admin/webhook-endpoints/{id}/rotate-secret:
    post:
      tags: [admin-webhooks]
      operationId: rotateWebhookEndpointSecret
      summary: Rotate a webhook endpoint's signing secret
      x-keipay-permission: apps:write
      security:
        - adminSession: []
          csrfToken: []
      description: |
        Issues a new signing secret, returned in plaintext exactly once.
        The current secret becomes the previous secret and keeps signing
        (as a second `v1=` in `X-KeiPay-Signature`) for `overlap_hours`
        (default 24, `0` ends it at once); any older previous secret is
        dropped. `X-Kei-Signature` uses only the new secret. Works on
        disabled endpoints. Records `webhook_endpoint.rotate_secret`
        (`after`: `{secret_last4, previous_secret_expires_at}`).
      parameters:
        - $ref: '#/components/parameters/WebhookEndpointIdPath'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RotateWebhookSecretRequest'
      responses:
        '200':
          description: The endpoint and its new one-time signing secret.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookEndpointSecretResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /admin/webhook-endpoints/{id}/disable:
    post:
      tags: [admin-webhooks]
      operationId: disableWebhookEndpoint
      summary: Disable a webhook endpoint
      x-keipay-permission: apps:write
      security:
        - adminSession: []
          csrfToken: []
      description: |
        Stops new deliveries to the endpoint (`disabled_reason` `manual`).
        Pending deliveries end `FAILED` without another attempt when their
        turn comes. Disabling a disabled endpoint returns it unchanged and
        records nothing; otherwise records `webhook_endpoint.disable`.
      parameters:
        - $ref: '#/components/parameters/WebhookEndpointIdPath'
      responses:
        '200':
          description: The disabled endpoint.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookEndpointResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /admin/webhook-endpoints/{id}/enable:
    post:
      tags: [admin-webhooks]
      operationId: enableWebhookEndpoint
      summary: Enable a webhook endpoint
      x-keipay-permission: apps:write
      security:
        - adminSession: []
          csrfToken: []
      description: |
        Re-activates the endpoint, whatever disabled it, and resets
        `consecutive_failures` to 0. Deliveries that failed meanwhile are
        not resent; replay them. Enabling an active endpoint returns it
        unchanged and records nothing; otherwise records
        `webhook_endpoint.enable`.
      parameters:
        - $ref: '#/components/parameters/WebhookEndpointIdPath'
      responses:
        '200':
          description: The active endpoint.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookEndpointResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /admin/webhook-endpoints/{id}/test:
    post:
      tags: [admin-webhooks]
      operationId: sendWebhookEndpointTest
      summary: Send a test event to one endpoint
      x-keipay-permission: apps:write
      security:
        - adminSession: []
          csrfToken: []
      description: |
        Creates a test event of `event_type` whose `data` is the catalog
        example and queues one delivery to this endpoint only, whatever
        its subscriptions and status (a disabled endpoint can be tested
        before enabling it). The request carries `X-KeiPay-Test: true`, is
        signed like any other, is attempted once (no retries) and never
        counts toward automatic disabling. Watch the returned delivery for
        the outcome. `event_type` must be a catalog type, not a wildcard
        (rule `oneof`). Records `webhook_endpoint.test`.
      parameters:
        - $ref: '#/components/parameters/WebhookEndpointIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendTestEventRequest'
      responses:
        '202':
          description: The queued test delivery.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookDeliveryResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /admin/event-types:
    get:
      tags: [admin-webhooks]
      operationId: listEventTypes
      summary: List the event catalog
      description: |
        Every event type KeiPay can send, in display order, with a
        description and an example `v2` envelope, plus the accepted
        wildcard subscriptions. Clients build event pickers from this list
        and never hard-code it. New types may be added.
      x-keipay-permission: apps:read
      responses:
        '200':
          description: The catalog.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventTypeListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /admin/providers:
    get:
      tags: [admin-connections]
      operationId: listProviders
      summary: List gateway providers
      description: |
        Every provider adapter built into this server, sorted by `name`,
        with the schemas the console renders forms from. Not paginated:
        the list is small and fixed per server version.
      x-keipay-permission: connections:read
      responses:
        '200':
          description: The providers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /admin/connections:
    get:
      tags: [admin-connections]
      operationId: listConnections
      summary: List connections
      description: |
        Cursor-paginated, newest first (`created_at` descending, then `id`
        descending). Includes disabled connections unless filtered. An
        unknown `environment`, `status` or `provider` returns
        `400 invalid_request` with rule `oneof`.
      x-keipay-permission: connections:read
      parameters:
        - name: environment
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/AppEnvironment'
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/ConnectionStatus'
        - name: provider
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/ProviderName'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of connections. Credentials are never returned here.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectionListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [admin-connections]
      operationId: createConnection
      summary: Create a connection
      x-keipay-permission: connections:write
      security:
        - adminSession: []
          csrfToken: []
      description: |
        Creates an active, untested connection. `credentials` and
        `settings` are validated against the provider's `ConfigSchema`:
        errors use field `credentials.<key>` or `settings.<key>` with rule
        `required`, `type`, `min_length`, `max_length`, `pattern`,
        `minimum`, `maximum`, `oneof` or `unknown` (a key the schema does
        not define), and the provider's own cross-field rules (Xendit:
        `credentials.secret_key` rule `environment` when a
        `xnd_development_` key is used for `live` or a `xnd_production_`
        key for `test`). Credential values are trimmed. Missing settings
        take their schema default. An unknown `provider` returns rule
        `oneof`. `name` must be unused (`409 conflict`). Does not contact
        the gateway; call `/test` next. Records `connection.create`
        (without credentials).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateConnectionRequest'
      responses:
        '201':
          description: The connection.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /admin/connections/{id}:
    get:
      tags: [admin-connections]
      operationId: getConnection
      summary: Get a connection
      x-keipay-permission: connections:read
      parameters:
        - $ref: '#/components/parameters/ConnectionIdPath'
      responses:
        '200':
          description: The connection, with credential hints, settings and channels.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      tags: [admin-connections]
      operationId: updateConnection
      summary: Update a connection's name or settings
      x-keipay-permission: connections:write
      security:
        - adminSession: []
          csrfToken: []
      description: |
        Send only the fields to change; `settings` replaces the whole
        object (missing keys take their default) and is validated like on
        create. `provider` and `environment` never change: a body
        containing either returns `400 invalid_request` with rule
        `immutable`. `credentials` in the body returns rule `immutable`
        too; use `PATCH /admin/connections/{id}/credentials`. A body with
        none of the updatable fields returns `400 invalid_request` with
        field `body` and rule `required`. A request that changes nothing
        returns the connection and records nothing; otherwise it records
        `connection.update` with only the changed fields.
      parameters:
        - $ref: '#/components/parameters/ConnectionIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateConnectionRequest'
      responses:
        '200':
          description: The connection.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /admin/connections/{id}/credentials:
    patch:
      tags: [admin-connections]
      operationId: updateConnectionCredentials
      summary: Replace some or all credentials
      x-keipay-permission: connections:write
      security:
        - adminSession: []
          csrfToken: []
      description: |
        Keys present in `credentials` replace the stored values; keys left
        out keep theirs. The merged result is validated like on create
        (an empty string fails `required`). An empty `credentials` object
        returns `400 invalid_request` with field `credentials` and rule
        `required`. The connection's test result is reset
        (`last_test_status` and `last_tested_at` become `null`). Records
        `connection.update_credentials` with the names of the replaced
        keys only.
      parameters:
        - $ref: '#/components/parameters/ConnectionIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateConnectionCredentialsRequest'
      responses:
        '200':
          description: The connection.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /admin/connections/{id}/disable:
    post:
      tags: [admin-connections]
      operationId: disableConnection
      summary: Disable a connection
      x-keipay-permission: connections:write
      security:
        - adminSession: []
          csrfToken: []
      description: |
        A disabled connection cannot be chosen as an app's default and
        creates no new checkouts; its callback URL keeps working for
        payments made earlier. Returns `409 connection_in_use` while any
        app (active or disabled) uses it as its default connection;
        `details.apps` lists up to 10 of them (`AppSummary`) and
        `details.app_count` their number. Disabling a disabled connection
        returns it unchanged and records nothing; otherwise records
        `connection.disable`.
      parameters:
        - $ref: '#/components/parameters/ConnectionIdPath'
      responses:
        '200':
          description: The connection.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /admin/connections/{id}/enable:
    post:
      tags: [admin-connections]
      operationId: enableConnection
      summary: Enable a connection
      x-keipay-permission: connections:write
      security:
        - adminSession: []
          csrfToken: []
      description: |
        Enabling an active connection returns it unchanged and records
        nothing; otherwise records `connection.enable`.
      parameters:
        - $ref: '#/components/parameters/ConnectionIdPath'
      responses:
        '200':
          description: The connection.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /admin/connections/{id}/test:
    post:
      tags: [admin-connections]
      operationId: testConnection
      summary: Test a connection's credentials
      x-keipay-permission: connections:write
      security:
        - adminSession: []
          csrfToken: []
      description: |
        Calls the gateway with the stored credentials (Xendit: list one
        invoice, which needs the invoice read permission KeiPay uses
        anyway) with a 10-second timeout. The outcome is a result, not an
        error: `200` with `result` `ok` or `failed` and a short `message`
        that never contains credentials or raw gateway responses. Stores
        `last_tested_at`, `last_test_status` and `last_test_error` and
        records `connection.test`. Works on disabled connections too.
      parameters:
        - $ref: '#/components/parameters/ConnectionIdPath'
      responses:
        '200':
          description: The test outcome and the updated connection.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectionTestResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /admin/connections/{id}/channels:
    put:
      tags: [admin-connections]
      operationId: replaceConnectionChannels
      summary: Choose the channels a connection offers
      x-keipay-permission: connections:write
      security:
        - adminSession: []
          csrfToken: []
      description: |
        Replaces the connection's channel list. Every `channel` must be
        one of the provider's `capabilities.channels` (rule `oneof` on
        `channels.<i>.channel`) and appear once (rule `duplicate`). A
        non-empty list must enable at least one channel (field `channels`,
        rule `min_enabled`). An empty list resets to the default: every
        channel of the provider enabled. When the enabled channels are a
        strict subset of the provider's channels, checkouts are limited to
        them (Xendit `payment_methods`); otherwise the checkout offers
        everything the gateway account has activated. Records
        `connection.update_channels` with before and after lists; a
        request that changes nothing records nothing.
      parameters:
        - $ref: '#/components/parameters/ConnectionIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplaceConnectionChannelsRequest'
      responses:
        '200':
          description: The connection.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /admin/payments:
    get:
      tags: [admin-payments]
      operationId: listAdminPayments
      summary: List payments
      x-keipay-permission: payments:read
      description: |
        Cursor-paginated, newest first (`created_at` descending, then `id`
        descending). Every filter is optional. An invalid value returns
        `400 invalid_request`: `app_id` rule `public_id`, `status` rule
        `oneof`, `from` or `to` rule `datetime`. An `app_id` that matches
        no app returns an empty page.
      parameters:
        - name: app_id
          in: query
          required: false
          description: Only payments of this app.
          schema:
            type: string
            pattern: '^app_[0-9A-HJKMNP-TV-Za-hjkmnp-tv-z]{26}$'
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/PaymentStatus'
        - $ref: '#/components/parameters/FromFilter'
        - $ref: '#/components/parameters/ToFilter'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of payments.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /admin/ledger:
    get:
      tags: [admin-payments]
      operationId: listLedger
      summary: List ledger entries with a per-app summary
      x-keipay-permission: payments:read
      description: |
        Offset-paginated, newest first. Unparseable filters are ignored, and
        an out-of-range `limit` falls back to the default. A well-formed
        `app_id` that matches no app returns no entries and an empty
        summary.
      parameters:
        - $ref: '#/components/parameters/AppIdFilter'
        - $ref: '#/components/parameters/FromFilter'
        - $ref: '#/components/parameters/ToFilter'
        - name: limit
          in: query
          required: false
          description: 1-500, default 100.
          schema:
            type: integer
            default: 100
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Ledger entries and per-app totals for the same filter.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LedgerListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /admin/webhook-deliveries:
    get:
      tags: [admin-webhooks]
      operationId: listWebhookDeliveries
      summary: List outbound webhook deliveries
      x-keipay-permission: deliveries:read
      description: |
        Cursor-paginated, newest first (`created_at` descending, then `id`
        descending). Every filter is optional and they combine with AND.
        An invalid value returns `400 invalid_request`: `app_id`,
        `endpoint_id` or `event_id` rule `public_id`; `status`,
        `event_type` or `environment` rule `oneof`; `from` or `to` rule
        `datetime`. A well-formed id that matches nothing returns an empty
        page. Rows do not carry the body; get one delivery for it.
      parameters:
        - name: app_id
          in: query
          required: false
          description: Only deliveries of this app.
          schema:
            type: string
            pattern: '^app_[0-9A-HJKMNP-TV-Za-hjkmnp-tv-z]{26}$'
        - name: endpoint_id
          in: query
          required: false
          description: Only deliveries to this endpoint (deleted endpoints included).
          schema:
            type: string
            pattern: '^whe_[0-9A-HJKMNP-TV-Za-hjkmnp-tv-z]{26}$'
        - name: event_id
          in: query
          required: false
          description: Only deliveries of this event (one per endpoint it fanned out to).
          schema:
            type: string
            pattern: '^evt_[0-9A-HJKMNP-TV-Za-hjkmnp-tv-z]{26}$'
        - name: event_type
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/EventType'
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/WebhookDeliveryStatus'
        - name: environment
          in: query
          required: false
          description: Only deliveries of apps in this environment.
          schema:
            $ref: '#/components/schemas/AppEnvironment'
        - $ref: '#/components/parameters/FromFilter'
        - $ref: '#/components/parameters/ToFilter'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of deliveries.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /admin/webhook-deliveries/{id}:
    get:
      tags: [admin-webhooks]
      operationId: getWebhookDelivery
      summary: Get a webhook delivery with its attempts
      description: |
        The delivery, the body as sent, and every attempt (request headers,
        response status and the first 4096 bytes of the response body),
        oldest first. Custom header values are shown as `[REDACTED]`.
      x-keipay-permission: deliveries:read
      parameters:
        - $ref: '#/components/parameters/DeliveryIdPath'
      responses:
        '200':
          description: The delivery.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookDeliveryDetailResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /admin/webhook-deliveries/{id}/replay:
    post:
      tags: [admin-webhooks]
      operationId: replayWebhookDelivery
      summary: Replay a webhook delivery
      x-keipay-permission: deliveries:replay
      security:
        - adminSession: []
          csrfToken: []
      description: |
        Sends the same event (same `X-KeiPay-Event-Id`, same body, a fresh
        signature) to the same endpoint once more: one attempt, not
        retried, which never counts toward automatic disabling. No new
        event or delivery is created, so receivers that dedupe on the
        event id see a duplicate. Only `DELIVERED` and `FAILED` deliveries
        can be replayed; otherwise `409 delivery_not_replayable` with
        `details.reason` `in_progress` (still `PENDING`), `no_endpoint`
        (a delivery from before webhook endpoints whose app had no webhook
        URL), `endpoint_deleted` or `endpoint_disabled`. Records
        `webhook_delivery.replay` (`before`: `{status, attempts}`).
      parameters:
        - $ref: '#/components/parameters/DeliveryIdPath'
      responses:
        '202':
          description: The delivery, `PENDING` again with one attempt queued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookDeliveryResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /admin/inbound-webhooks:
    get:
      tags: [admin-webhooks]
      operationId: listInboundWebhooks
      summary: List inbound gateway webhooks
      x-keipay-permission: deliveries:read
      description: |
        Every callback that reached a known connection, newest first
        (`received_at` descending, then `id` descending), cursor-paginated.
        An invalid filter returns `400 invalid_request`: `connection_id`
        rule `public_id`; `result` or `environment` rule `oneof`; `from`
        or `to` rule `datetime` (bounds on `received_at`). Rows do not
        carry the body; get one inbound webhook for it.
      parameters:
        - name: connection_id
          in: query
          required: false
          schema:
            type: string
            pattern: '^con_[0-9A-HJKMNP-TV-Za-hjkmnp-tv-z]{26}$'
        - name: result
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/InboundWebhookResult'
        - name: environment
          in: query
          required: false
          description: Only callbacks of connections in this environment.
          schema:
            $ref: '#/components/schemas/AppEnvironment'
        - name: from
          in: query
          required: false
          description: Inclusive lower bound on `received_at` (RFC 3339).
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          description: Inclusive upper bound on `received_at` (RFC 3339).
          schema:
            type: string
            format: date-time
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of inbound webhooks.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InboundWebhookListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /admin/inbound-webhooks/{id}:
    get:
      tags: [admin-webhooks]
      operationId: getInboundWebhook
      summary: Get an inbound gateway webhook with its raw body
      x-keipay-permission: deliveries:read
      parameters:
        - $ref: '#/components/parameters/InboundWebhookIdPath'
      responses:
        '200':
          description: The inbound webhook.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InboundWebhookDetailResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /admin/audit-logs:
    get:
      tags: [admin-audit]
      operationId: listAuditLogs
      summary: List audit log entries
      x-keipay-permission: audit:read
      description: Cursor-paginated, newest first (`occurred_at` descending, then `id` descending).
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of audit entries.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLogListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

webhooks:
  event:
    post:
      operationId: webhookEventV2
      summary: Event sent to a webhook endpoint (api_version v2)
      description: |
        Sent to every active endpoint of the app whose subscriptions match
        the event type, once per event. Verify `X-KeiPay-Signature` (see
        "Webhooks to apps": HMAC-SHA256 of `"{t}.{raw body}"` with the
        endpoint's signing secret, compared in constant time against every
        `v1=` value) and reject a `t` more than 5 minutes old. Return any
        `2xx` within 15 seconds to acknowledge; anything else is retried
        per the endpoint's retry policy. Delivery is at-least-once: dedupe
        on `X-KeiPay-Event-Id` (equal to the body's `id`).
      security: []
      parameters:
        - name: X-KeiPay-Event-Id
          in: header
          required: true
          schema:
            type: string
            pattern: '^evt_[0-9A-HJKMNP-TV-Z]{26}$'
        - name: X-KeiPay-Event-Type
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/EventType'
        - name: X-KeiPay-Delivery-Id
          in: header
          required: true
          description: The delivery (one per event and endpoint); a replay reuses it.
          schema:
            type: string
            pattern: '^dlv_[0-9A-HJKMNP-TV-Z]{26}$'
        - name: X-KeiPay-Signature
          in: header
          required: true
          description: '`t=<unix seconds>` then one or more `v1=<64 hex>`, comma-separated, newest secret first.'
          schema:
            type: string
            pattern: '^t=[0-9]+(,v1=[0-9a-f]{64})+$'
            examples: ['t=1730109600,v1=5257a869e7ecebeda32affa62cdca3fa51cad7e77a0e56ff536d0ce8e108d8bd']
        - name: X-KeiPay-Test
          in: header
          required: false
          description: '`true` on test sends (`POST /admin/webhook-endpoints/{id}/test`); absent otherwise.'
          schema:
            type: string
            const: 'true'
        - name: X-Kei-Signature
          in: header
          required: false
          description: Only for endpoints with `legacy_signature`. Hex HMAC-SHA256 of the raw body with the current secret.
          schema:
            type: string
            pattern: '^[0-9a-f]{64}$'
        - name: X-Kei-Event
          in: header
          required: false
          description: Only for endpoints with `legacy_signature`. Same value as `X-KeiPay-Event-Type`.
          schema:
            $ref: '#/components/schemas/EventType'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookEnvelope'
      responses:
        '200':
          description: Acknowledged. Any 2xx status works.
  paymentEventV1:
    post:
      operationId: paymentEventWebhookV1
      summary: Event sent to a webhook endpoint (api_version v1)
      deprecated: true
      description: |
        The flat body sent before the v2 envelope, still used by endpoints
        whose `api_version` is `v1` (endpoints migrated from an app's
        `webhook_url` start there). Headers are the same as for `v2`;
        migrated endpoints also get `X-Kei-Signature` and `X-Kei-Event`
        until `legacy_signature` is turned off. Move to `v2` by switching
        the endpoint's `api_version` once your receiver reads the envelope.
      security: []
      parameters:
        - name: X-KeiPay-Event-Id
          in: header
          required: false
          description: Absent only when replaying a delivery made before events existed (its body has no `event_id` either).
          schema:
            type: string
            pattern: '^evt_[0-9A-HJKMNP-TV-Z]{26}$'
        - name: X-KeiPay-Signature
          in: header
          required: true
          schema:
            type: string
            pattern: '^t=[0-9]+(,v1=[0-9a-f]{64})+$'
        - name: X-Kei-Event
          in: header
          required: false
          schema:
            $ref: '#/components/schemas/EventType'
        - name: X-Kei-Signature
          in: header
          required: false
          schema:
            type: string
            pattern: '^[0-9a-f]{64}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentWebhookEvent'
      responses:
        '200':
          description: Acknowledged. Any 2xx status works.

components:
  securitySchemes:
    adminSession:
      type: apiKey
      in: cookie
      name: keipay_session
      description: |
        Session cookie set by `POST /admin/login` or `POST /admin/setup`.
        Missing: `401 session_required`. Unknown, idle, past its absolute
        lifetime, revoked, or its user disabled: `401 session_expired`.
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: |
        The current `keipay_csrf` cookie value. Required on every `POST`,
        `PUT`, `PATCH` and `DELETE` under `/admin/`, including sign-in,
        setup and logout; with a session it must equal the session's token.
        Missing or wrong: `403 invalid_csrf_token`.
    appApiKey:
      type: apiKey
      in: header
      name: X-Api-Key
      description: An app API key (`kp_test_…`, `kp_live_…`, or a legacy `kp_…`). Identifies the app; not a secret on its own.
    appTimestamp:
      type: apiKey
      in: header
      name: X-Timestamp
      description: Unix seconds; must be within 5 minutes of server time.
    appSignature:
      type: apiKey
      in: header
      name: X-Signature
      description: |
        Hex HMAC-SHA256 of `"{X-Timestamp}.{rawBody}"` keyed with the API
        secret of the key in `X-Api-Key`. Each signature is accepted once
        (replay protection).
    xenditCallbackToken:
      type: apiKey
      in: header
      name: x-callback-token
      description: The webhook verification token from the Xendit dashboard; must equal the target connection's `callback_token` credential.

  parameters:
    UserIdPath:
      name: id
      in: path
      required: true
      description: |
        User id (`usr_…`; lower case is accepted). Any other format returns
        `400 invalid_request` with `details.fields` `[{"field": "id", "rule": "public_id"}]`.
      schema:
        type: string
        pattern: '^usr_[0-9A-HJKMNP-TV-Z]{26}$'
        examples: [usr_01JBKQ7Z8M4X2Y6V3N9T5R1W0C]
    PaymentIdPath:
      name: id
      in: path
      required: true
      description: |
        The payment's `pay_…` id (lower case accepted) or its legacy integer
        `payment_id`. Anything else returns `400 invalid_request` with
        `details.fields` `[{"field": "id", "rule": "public_id"}]`. A payment
        of another app, or an integer below 1, returns `404 not_found`.
      schema:
        type: string
        pattern: '^(pay_[0-9A-HJKMNP-TV-Za-hjkmnp-tv-z]{26}|[0-9]{1,19})$'
        examples: [pay_01JBKQ7Z8M4X2Y6V3N9T5R1W0C]
    AppIdPath:
      name: id
      in: path
      required: true
      description: |
        App id (`app_…`; lower case is accepted). Any other format returns
        `400 invalid_request` with `details.fields` `[{"field": "id", "rule": "public_id"}]`.
      schema:
        type: string
        pattern: '^app_[0-9A-HJKMNP-TV-Za-hjkmnp-tv-z]{26}$'
        examples: [app_01JBKQ7Z8M4X2Y6V3N9T5R1W0C]
    ApiKeyIdPath:
      name: key_id
      in: path
      required: true
      description: |
        API key id (`key_…`; lower case is accepted). Any other format
        returns `400 invalid_request` with `details.fields`
        `[{"field": "key_id", "rule": "public_id"}]`.
      schema:
        type: string
        pattern: '^key_[0-9A-HJKMNP-TV-Za-hjkmnp-tv-z]{26}$'
        examples: [key_01JBKQ7Z8M4X2Y6V3N9T5R1W0C]
    ConnectionIdPath:
      name: id
      in: path
      required: true
      description: |
        Connection id (`con_…`; lower case is accepted). Any other format
        returns `400 invalid_request` with `details.fields`
        `[{"field": "id", "rule": "public_id"}]`.
      schema:
        type: string
        pattern: '^con_[0-9A-HJKMNP-TV-Za-hjkmnp-tv-z]{26}$'
        examples: [con_01JBKQ7Z8M4X2Y6V3N9T5R1W0C]
    WebhookEndpointIdPath:
      name: id
      in: path
      required: true
      description: |
        Webhook endpoint id (`whe_…`; lower case is accepted). Any other
        format returns `400 invalid_request` with `details.fields`
        `[{"field": "id", "rule": "public_id"}]`.
      schema:
        type: string
        pattern: '^whe_[0-9A-HJKMNP-TV-Za-hjkmnp-tv-z]{26}$'
        examples: [whe_01JBKQ7Z8M4X2Y6V3N9T5R1W0C]
    DeliveryIdPath:
      name: id
      in: path
      required: true
      description: |
        Delivery id (`dlv_…`; lower case is accepted). Any other format,
        including the integer ids used before, returns
        `400 invalid_request` with `details.fields`
        `[{"field": "id", "rule": "public_id"}]`.
      schema:
        type: string
        pattern: '^dlv_[0-9A-HJKMNP-TV-Za-hjkmnp-tv-z]{26}$'
        examples: [dlv_01JBKQ7Z8M4X2Y6V3N9T5R1W0C]
    InboundWebhookIdPath:
      name: id
      in: path
      required: true
      description: |
        Inbound webhook id (`inb_…`; lower case is accepted). Any other
        format returns `400 invalid_request` with `details.fields`
        `[{"field": "id", "rule": "public_id"}]`.
      schema:
        type: string
        pattern: '^inb_[0-9A-HJKMNP-TV-Za-hjkmnp-tv-z]{26}$'
        examples: [inb_01JBKQ7Z8M4X2Y6V3N9T5R1W0C]
    AppIdFilter:
      name: app_id
      in: query
      required: false
      description: Only rows of this app (`app_…`). On these legacy offset lists an unparseable value is ignored; a well-formed id that matches no app still filters, so no rows are returned.
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        Optional retry key, unique per app (see Idempotency). 1-255
        printable ASCII characters without spaces; an empty header counts as
        absent. Invalid: `400 invalid_request` with field `Idempotency-Key`
        and rule `max` (longer than 255) or `format`.
      schema:
        type: string
        minLength: 1
        maxLength: 255
        pattern: '^[\x21-\x7E]+$'
        examples: [3f1c2d9e-7b1a-4c55-9a1e-2f0f6f1b9c11]
    FromFilter:
      name: from
      in: query
      required: false
      description: Inclusive lower bound on `created_at` (RFC 3339).
      schema:
        type: string
        format: date-time
    ToFilter:
      name: to
      in: query
      required: false
      description: Inclusive upper bound on `created_at` (RFC 3339).
      schema:
        type: string
        format: date-time
    Offset:
      name: offset
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0
    Limit:
      name: limit
      in: query
      required: false
      description: Page size. Outside 1-200 returns `400 invalid_request`.
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque `next_cursor` from the previous page. A malformed cursor returns `400 invalid_cursor`.
      schema:
        type: string

  headers:
    SessionCookies:
      description: |
        `keipay_session` (session id, `HttpOnly`) and `keipay_csrf` (CSRF
        token, readable by scripts), both `SameSite=Lax; Path=/` and `Secure`
        unless `COOKIE_SECURE` resolves to false. On logout `keipay_session`
        is expired (`Max-Age=0`).
      schema:
        type: string
    RetryAfter:
      description: Seconds until the rate limit window ends.
      schema:
        type: integer
        minimum: 1
    IdempotentReplayed:
      description: '`true` when the response is an existing payment returned for a repeated `order_id` or `Idempotency-Key`; absent on a newly created payment.'
      schema:
        type: string
        const: 'true'

  responses:
    BadRequest:
      description: |
        `invalid_request` (malformed body, failed field validation, a
        non-integer path id, or a bad `limit` on a cursor-paginated list;
        `details.fields` lists offending fields), `validation_failed`
        (business validation), or `invalid_cursor`. The legacy
        offset-paginated lists ignore unparseable filters instead.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: |
        Authentication failed. The `code` says why: `session_required` or
        `session_expired` on admin routes, `invalid_credentials` on sign-in
        and password change, the app key and signature codes on `/v1`
        (including `api_key_revoked` and `api_key_expired`), and
        `invalid_callback_token` on gateway callbacks.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: |
        `forbidden` (the role lacks the operation's `x-keipay-permission`),
        `password_change_required`, `invalid_csrf_token`,
        `invalid_setup_token`, or on `/v1` `tenant_inactive` (the app is
        disabled).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: '`not_found`.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: |
        `conflict` (duplicate slug within an environment, duplicate
        connection name or email, or an `order_id` reused with a different
        amount or currency), `idempotency_key_reused`, `setup_completed`,
        `last_owner`, `cannot_modify_self`, `connection_in_use`, or
        `delivery_not_replayable`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UnprocessableEntity:
      description: |
        `no_eligible_connection` (the app has no usable default
        connection; `details.reasons`) or `provider_rejected` (the gateway
        refused the request; `details.provider` names it).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ServiceUnavailable:
      description: |
        `provider_unavailable`: the gateway could not be reached, timed
        out, or answered with a server error. No payment was stored; retry
        with the same `order_id`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    TooManyRequests:
      description: '`rate_limited`: too many failed attempts. Retry after `Retry-After` seconds (also in `details.retry_after_seconds`).'
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: '`internal_error`. The message never contains internal details.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    ErrorCode:
      type: string
      description: |
        Stable machine-readable error code. New codes may be added; existing
        codes keep their meaning.

        | code | status | meaning |
        |---|---|---|
        | `invalid_request` | 400 | Malformed JSON, failed field validation, a non-integer path id, or a bad `limit` on a cursor-paginated list. `details.fields` is a list of `{field, rule}`. The legacy offset-paginated lists ignore unparseable query filters instead of rejecting them. |
        | `validation_failed` | 400 | The request is well-formed but breaks a business rule. |
        | `invalid_cursor` | 400 | The `cursor` is malformed or was not issued by this endpoint. |
        | `unauthorized` | 401 | Authentication failed for a reason not listed below. |
        | `invalid_credentials` | 401 | Wrong email or password (also returned for a disabled user), or wrong current password. |
        | `missing_token` | 401 | Not returned since admin bearer tokens were replaced by session cookies; kept so the code keeps its meaning. |
        | `invalid_token` | 401 | Not returned since admin bearer tokens were replaced by session cookies; kept so the code keeps its meaning. |
        | `session_required` | 401 | Admin request without a `keipay_session` cookie. |
        | `session_expired` | 401 | The session is unknown, idle too long, past its absolute lifetime, or was ended (logout, user disabled, password changed or reset). Sign in again. |
        | `missing_signature_headers` | 401 | App request without `X-Api-Key`, `X-Timestamp` or `X-Signature`. |
        | `invalid_timestamp` | 401 | `X-Timestamp` is not unix seconds. |
        | `timestamp_out_of_range` | 401 | `X-Timestamp` is more than 5 minutes from server time. |
        | `unknown_api_key` | 401 | No app key matches `X-Api-Key`. |
        | `api_key_revoked` | 401 | The key was revoked. Use another key of the app. |
        | `api_key_expired` | 401 | The key's `expires_at` has passed. Use another key of the app. |
        | `invalid_signature` | 401 | `X-Signature` does not match. |
        | `replayed_request` | 401 | This signature was already used. |
        | `invalid_callback_token` | 401 | Gateway callback token is missing or wrong. |
        | `tenant_inactive` | 403 | The app is disabled. (The name dates from when apps were called tenants.) |
        | `forbidden` | 403 | The signed-in user's role lacks the operation's permission (`x-keipay-permission`). |
        | `password_change_required` | 403 | The user must change their password first (`POST /admin/me/password`). |
        | `invalid_csrf_token` | 403 | `X-CSRF-Token` is missing, does not match the `keipay_csrf` cookie, or does not match the session. |
        | `invalid_setup_token` | 403 | The server requires `SETUP_TOKEN` and `setup_token` is missing or wrong. |
        | `not_found` | 404 | The resource or route does not exist. |
        | `conflict` | 409 | Duplicate (slug within an environment, email), or an `order_id` repeated with a different amount or currency. |
        | `idempotency_key_reused` | 409 | The `Idempotency-Key` was already used by this app for a different request. |
        | `setup_completed` | 409 | First-run setup already happened; sign in instead. |
        | `last_owner` | 409 | The change would leave no active owner. |
        | `cannot_modify_self` | 409 | Owners cannot disable themselves or reset their own password through the users API. |
        | `delivery_not_replayable` | 409 | The delivery cannot be replayed now. `details.reason`: `in_progress` (still `PENDING`), `no_endpoint`, `endpoint_deleted` or `endpoint_disabled`. |
        | `connection_in_use` | 409 | The connection is some app's default connection. `details.apps` lists up to 10 (`AppSummary`), `details.app_count` counts them. |
        | `no_eligible_connection` | 422 | No connection can take the payment. `details.reasons` is a list of strings: `no_default_connection`, `connection_disabled`. More reasons may be added. |
        | `provider_rejected` | 422 | The gateway refused the request (validation, limits, credentials). `details.provider` names the provider. The message is generic; the gateway's own text is only logged. |
        | `rate_limited` | 429 | Too many failed attempts. `details.retry_after_seconds` and the `Retry-After` header say when to retry. |
        | `internal_error` | 500 | Unexpected server error. |
        | `provider_unavailable` | 503 | The gateway could not be reached, timed out, or answered with a server error. Retry with the same `order_id`. |
      enum:
        - invalid_request
        - validation_failed
        - invalid_cursor
        - unauthorized
        - invalid_credentials
        - missing_token
        - invalid_token
        - missing_signature_headers
        - invalid_timestamp
        - timestamp_out_of_range
        - unknown_api_key
        - invalid_signature
        - replayed_request
        - invalid_callback_token
        - tenant_inactive
        - not_found
        - conflict
        - internal_error
        - session_required
        - session_expired
        - forbidden
        - password_change_required
        - invalid_csrf_token
        - invalid_setup_token
        - setup_completed
        - last_owner
        - cannot_modify_self
        - rate_limited
        - api_key_revoked
        - api_key_expired
        - idempotency_key_reused
        - connection_in_use
        - delivery_not_replayable
        - no_eligible_connection
        - provider_rejected
        - provider_unavailable

    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, details]
          properties:
            code:
              $ref: '#/components/schemas/ErrorCode'
            message:
              type: string
              description: Human-readable; may change. Never contains secrets or internal errors.
            details:
              type: object
              description: Always present; empty unless the code documents keys.
              additionalProperties: true
              properties:
                fields:
                  type: array
                  description: Set for `invalid_request` caused by field validation.
                  items:
                    $ref: '#/components/schemas/FieldError'
                retry_after_seconds:
                  type: integer
                  minimum: 1
                  description: Set for `rate_limited`; same value as the `Retry-After` header.
      example:
        error:
          code: invalid_request
          message: invalid request body
          details:
            fields:
              - field: order_id
                rule: required

    FieldError:
      type: object
      additionalProperties: false
      required: [field, rule]
      properties:
        field:
          type: string
          description: JSON field name (dot path for nested fields).
          examples: [order_id, items.0.quantity]
        rule:
          type: string
          description: The failed rule, e.g. `required`, `min`, `gt`, `type`.

    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          const: ok

    PaymentStatus:
      type: string
      description: Normalized lifecycle. Status only moves forward (PENDING → PAID → SETTLED); a late success after EXPIRED or FAILED is still applied.
      enum: [PENDING, PAID, SETTLED, EXPIRED, FAILED]

    EventType:
      type: string
      description: |
        The event catalog (`GET /admin/event-types` has descriptions and
        examples). `payment.duplicate` is reserved for a payment paid more
        than once; it is not sent yet. New types may be added; ignore types
        you do not handle.
      enum: [payment.paid, payment.settled, payment.expired, payment.failed, payment.duplicate]

    OrderItem:
      type: object
      required: [name, quantity, price]
      properties:
        name:
          type: string
          minLength: 1
        quantity:
          type: integer
          format: int32
          minimum: 1
        price:
          type: integer
          format: int64
          minimum: 0
          description: Unit price in minor units of the payment currency.
        category:
          type: string
        reference_id:
          type: string
        url:
          type: string

    Customer:
      type: object
      properties:
        given_names:
          type: string
        surname:
          type: string
        email:
          type: string
        mobile_number:
          type: string

    CreatePaymentRequest:
      type: object
      required: [order_id, amount]
      properties:
        order_id:
          type: string
          minLength: 1
          description: Your order reference; unique per app.
        amount:
          type: integer
          format: int64
          minimum: 1
          description: Minor units of `currency` (for IDR, whole rupiah).
        currency:
          type: string
          default: IDR
          description: ISO 4217 code.
        description:
          type: string
        payer_email:
          type: string
        invoice_duration:
          type: integer
          description: Checkout lifetime in seconds. Zero or omitted uses the gateway default.
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
        customer:
          $ref: '#/components/schemas/Customer'
        expected_settlement_at:
          type: string
          format: date-time
          description: Optional estimate you can show your user before funds settle.
        metadata:
          $ref: '#/components/schemas/Metadata'

    PaymentResponse:
      type: object
      required: [id, payment_id, reference, order_id, status, amount, currency, invoice_url, metadata]
      properties:
        id:
          type: string
          pattern: '^pay_[0-9A-HJKMNP-TV-Z]{26}$'
          examples: [pay_01JBKQ7Z8M4X2Y6V3N9T5R1W0C]
        payment_id:
          type: integer
          format: int64
          description: Legacy integer id, kept for existing integrations. Prefer `id`.
        reference:
          type: string
          description: |
            The reference KeiPay sent to the gateway (Xendit `external_id`):
            `kp_` + `id` for payments created since apps replaced tenants,
            `{slug}:{order_id}` for older ones.
          examples: [kp_pay_01JBKQ7Z8M4X2Y6V3N9T5R1W0C]
        order_id:
          type: string
        status:
          $ref: '#/components/schemas/PaymentStatus'
        amount:
          type: integer
          format: int64
        currency:
          type: string
        invoice_url:
          type: string
          description: Hosted checkout URL to redirect the payer to.
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
        metadata:
          $ref: '#/components/schemas/Metadata'
        expires_at:
          type: string
          format: date-time
        paid_at:
          type: string
          format: date-time
        settled_at:
          type: string
          format: date-time
        expected_settlement_at:
          type: string
          format: date-time

    GatewayCallback:
      type: object
      description: The provider's own callback body, stored raw. For `xendit` see `XenditInvoiceCallback`.
      additionalProperties: true

    XenditInvoiceCallback:
      type: object
      description: The subset of the Xendit invoice callback KeiPay reads. Other fields are stored raw and ignored.
      required: [id, external_id, status]
      properties:
        id:
          type: string
        external_id:
          type: string
          description: The payment's reference, matched against stored references (`kp_pay_…`, or `{slug}:{order_id}` for older payments). It is never parsed.
        status:
          type: string
          examples: [PAID, SETTLED, EXPIRED]
        amount:
          type: integer
          format: int64
        currency:
          type: string
        paid_amount:
          type: integer
          format: int64
        fees_paid_amount:
          type: integer
          format: int64
        paid_at:
          type: string
        settlement_date:
          type: string
        updated:
          type: string
      additionalProperties: true

    ReceivedResponse:
      type: object
      required: [received]
      properties:
        received:
          type: boolean
          const: true

    UserRole:
      type: string
      description: |
        `owner` manages everything, including users. `admin` manages
        everything except users. `viewer` is read-only and cannot read the
        audit log.
      enum: [owner, admin, viewer]

    UserStatus:
      type: string
      description: '`disabled` exactly when `disabled_at` is set.'
      enum: [active, disabled]

    Permission:
      type: string
      description: See "Roles and permissions" above. New permissions may be added.
      enum:
        - 'apps:read'
        - 'apps:write'
        - 'connections:read'
        - 'connections:write'
        - 'payments:read'
        - 'deliveries:read'
        - 'deliveries:replay'
        - 'audit:read'
        - 'users:manage'

    Email:
      type: string
      format: email
      minLength: 3
      maxLength: 254
      description: |
        One address without a display name, for example `ops@example.com`.
        Unicode is allowed. KeiPay trims it, applies Unicode NFC and lower
        case, and stores that form, so emails are unique and matched
        case-insensitively. Invalid: `400 invalid_request` with rule `email`.
      examples: [ops@example.com]

    UserName:
      type: string
      minLength: 1
      maxLength: 100
      description: Display name, trimmed; blank after trimming is rejected (`required`).
      examples: [Ops Lead]

    NewPassword:
      type: string
      format: password
      minLength: 12
      maxLength: 72
      description: |
        At least 12 characters (Unicode code points) and at most 72 bytes as
        UTF-8, the bcrypt limit. Hashed exactly as sent, without trimming or
        normalization. Violations: `400 invalid_request` with rule `min` or
        `max`.

    User:
      type: object
      required: [id, email, name, role, status, must_change_password, disabled_at, last_login_at, created_at, updated_at]
      properties:
        id:
          type: string
          pattern: '^usr_[0-9A-HJKMNP-TV-Z]{26}$'
          examples: [usr_01JBKQ7Z8M4X2Y6V3N9T5R1W0C]
        email:
          type: string
          description: Stored (trimmed, NFC, lower-case) form.
        name:
          type: string
        role:
          $ref: '#/components/schemas/UserRole'
        status:
          $ref: '#/components/schemas/UserStatus'
        must_change_password:
          type: boolean
          description: True after an owner creates the user or resets their password, until the user changes it.
        disabled_at:
          type: [string, 'null']
          format: date-time
        last_login_at:
          type: [string, 'null']
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    MeResponse:
      type: object
      required: [user, permissions]
      properties:
        user:
          $ref: '#/components/schemas/User'
        permissions:
          type: array
          description: Everything the user's role allows, sorted. Hide what is not listed; the server enforces it anyway.
          items:
            $ref: '#/components/schemas/Permission'

    SetupStatusResponse:
      type: object
      required: [setup_required, setup_token_required]
      properties:
        setup_required:
          type: boolean
          description: True while no user exists.
        setup_token_required:
          type: boolean
          description: True when the server has `SETUP_TOKEN` set; then `POST /admin/setup` needs `setup_token`.

    SetupRequest:
      type: object
      required: [email, name, password]
      properties:
        email:
          $ref: '#/components/schemas/Email'
        name:
          $ref: '#/components/schemas/UserName'
        password:
          $ref: '#/components/schemas/NewPassword'
        setup_token:
          type: string
          maxLength: 256
          format: password
          description: Required when `setup_token_required` is true; ignored otherwise.

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          minLength: 1
          maxLength: 254
          description: Not format-checked here; a malformed email simply does not match (`401 invalid_credentials`).
        password:
          type: string
          minLength: 1
          maxLength: 1024
          format: password

    ChangePasswordRequest:
      type: object
      required: [current_password, new_password]
      properties:
        current_password:
          type: string
          minLength: 1
          maxLength: 1024
          format: password
        new_password:
          $ref: '#/components/schemas/NewPassword'

    CreateUserRequest:
      type: object
      required: [email, name, role]
      properties:
        email:
          $ref: '#/components/schemas/Email'
        name:
          $ref: '#/components/schemas/UserName'
        role:
          $ref: '#/components/schemas/UserRole'

    UpdateUserRequest:
      type: object
      minProperties: 1
      description: |
        Send only the fields to change; unknown fields are ignored. A body
        with none of these fields returns `400 invalid_request` with
        `details.fields` `[{"field": "body", "rule": "required"}]`.
      properties:
        email:
          $ref: '#/components/schemas/Email'
        name:
          $ref: '#/components/schemas/UserName'
        role:
          $ref: '#/components/schemas/UserRole'

    UserResponse:
      type: object
      required: [user]
      properties:
        user:
          $ref: '#/components/schemas/User'

    UserWithTemporaryPasswordResponse:
      type: object
      required: [user, temporary_password]
      properties:
        user:
          $ref: '#/components/schemas/User'
        temporary_password:
          type: string
          minLength: 20
          maxLength: 20
          description: |
            20 random characters from an alphabet without look-alikes
            (no `0 O 1 l I`). Shown once and never stored in plaintext; the
            user must change it at first sign-in.

    UserListResponse:
      type: object
      required: [data, next_cursor]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/User'
        next_cursor:
          type: [string, 'null']
          description: Pass as `cursor` to get the next page; `null` on the last page.

    AppEnvironment:
      type: string
      description: |
        `test` or `live`. Fixed when the app is created; the app's keys
        carry it (`kp_test_…`, `kp_live_…`).
      enum: [test, live]

    AppStatus:
      type: string
      description: '`disabled` apps get `403 tenant_inactive` on every `/v1` request.'
      enum: [active, disabled]

    AppSlug:
      type: string
      pattern: '^[a-z0-9][a-z0-9-]{1,30}[a-z0-9]$'
      description: |
        3-32 characters of `a-z`, `0-9` and `-`, starting and ending with a
        letter or digit (surrounding spaces are trimmed and upper case is
        lowered before checking). Unique within an environment; never
        changes. Invalid: rule `slug`.
      examples: [acme-shop]

    AppName:
      type: string
      minLength: 1
      maxLength: 100
      description: Display name, trimmed. Blank is rejected (`required`), more than 100 characters `max`, control characters `name`.
      examples: [Acme Shop]

    HttpUrl:
      type: string
      maxLength: 2048
      description: |
        Empty (none), or an absolute `http` or `https` URL with a host, at
        most 2048 bytes, without whitespace or control characters.
        Invalid: rule `url`.
      examples: [https://shop.example.com/hooks/keipay]

    Metadata:
      type: object
      maxProperties: 50
      propertyNames:
        minLength: 1
        maxLength: 40
      additionalProperties:
        type: [string, number, boolean, 'null']
        maxLength: 500
      description: |
        Your own key-value data, stored and returned with the same keys
        and values (key order is not kept; numbers are never rounded
        through floating point). At most 50 keys; each key 1-40
        characters (Unicode code points) without control characters; each
        value a string of at most 500 characters, a number, a boolean or
        `null` (no nested objects or arrays); no string may contain U+0000;
        at most 8192 bytes as compact JSON. Omitted or `null` means `{}`.
        Violations return `400 invalid_request` with `metadata` and rule
        `object` (not an object), `max_keys`, `key` or `max_bytes`, or with
        `metadata.<key>` and rule `type` (nested value), `max` (string too
        long) or `invalid_character` (U+0000).
      examples:
        - channel: mobile
          campaign: promo-11.11
          customer_tier: 2

    App:
      type: object
      required: [id, slug, name, environment, status, metadata, redirect_success_url, redirect_failure_url, default_connection, created_at, updated_at]
      properties:
        default_connection:
          description: The connection `POST /v1/payments` uses; `null` when none is set. Always the app's environment.
          oneOf:
            - $ref: '#/components/schemas/ConnectionSummary'
            - type: 'null'
        id:
          type: string
          pattern: '^app_[0-9A-HJKMNP-TV-Z]{26}$'
          examples: [app_01JBKQ7Z8M4X2Y6V3N9T5R1W0C]
        slug:
          type: string
          description: See `AppSlug`. Never changes.
        name:
          type: string
        environment:
          $ref: '#/components/schemas/AppEnvironment'
        status:
          $ref: '#/components/schemas/AppStatus'
        metadata:
          $ref: '#/components/schemas/Metadata'
        redirect_success_url:
          type: string
        redirect_failure_url:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    AppSummary:
      type: object
      description: The app a row belongs to.
      required: [id, slug, name, environment]
      properties:
        id:
          type: string
          pattern: '^app_[0-9A-HJKMNP-TV-Z]{26}$'
        slug:
          type: string
        name:
          type: string
        environment:
          $ref: '#/components/schemas/AppEnvironment'

    CreateAppRequest:
      type: object
      required: [name, slug, environment]
      properties:
        name:
          $ref: '#/components/schemas/AppName'
        slug:
          $ref: '#/components/schemas/AppSlug'
        environment:
          $ref: '#/components/schemas/AppEnvironment'
        redirect_success_url:
          $ref: '#/components/schemas/HttpUrl'
        redirect_failure_url:
          $ref: '#/components/schemas/HttpUrl'
        metadata:
          $ref: '#/components/schemas/Metadata'

    UpdateAppRequest:
      type: object
      minProperties: 1
      description: |
        Send only the fields to change. `slug` or `environment` in the body
        returns `400 invalid_request` with rule `immutable`.
      properties:
        default_connection_id:
          type: [string, 'null']
          pattern: '^con_[0-9A-HJKMNP-TV-Za-hjkmnp-tv-z]{26}$'
          description: An active connection with the app's environment, or `null` to clear.
        name:
          $ref: '#/components/schemas/AppName'
        redirect_success_url:
          $ref: '#/components/schemas/HttpUrl'
        redirect_failure_url:
          $ref: '#/components/schemas/HttpUrl'
        metadata:
          $ref: '#/components/schemas/Metadata'

    AppResponse:
      type: object
      required: [app]
      properties:
        app:
          $ref: '#/components/schemas/App'

    AppListResponse:
      type: object
      required: [data, next_cursor]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/App'
        next_cursor:
          type: [string, 'null']
          description: Pass as `cursor` to get the next page; `null` on the last page.

    AppCreatedResponse:
      type: object
      required: [app, key, api_key, api_secret]
      properties:
        app:
          $ref: '#/components/schemas/App'
        key:
          $ref: '#/components/schemas/ApiKey'
        api_key:
          type: string
          description: The full API key for `X-Api-Key`. Shown once; KeiPay keeps only its hash.
          examples: [kp_test_3f9a0c1d2e4b5a69788796a5b4c3d2e1]
        api_secret:
          type: string
          format: password
          description: The HMAC secret for `X-Signature`. Shown once; store it now.

    ApiKeyStatus:
      type: string
      description: Derived. `revoked` once `revoked_at` is set; else `expired` once `expires_at` has passed; else `active`.
      enum: [active, expired, revoked]

    ApiKeyLabel:
      type: string
      minLength: 1
      maxLength: 60
      description: What the key is for, trimmed. Blank is rejected (`required`), more than 60 characters `max`, control characters `name`.
      examples: [Production server]

    ApiKey:
      type: object
      required: [id, app_id, label, environment, prefix, last4, status, last_used_at, expires_at, revoked_at, created_at]
      properties:
        id:
          type: string
          pattern: '^key_[0-9A-HJKMNP-TV-Z]{26}$'
          examples: [key_01JBKQ7Z8M4X2Y6V3N9T5R1W0C]
        app_id:
          type: string
          pattern: '^app_[0-9A-HJKMNP-TV-Z]{26}$'
        label:
          type: string
        environment:
          $ref: '#/components/schemas/AppEnvironment'
        prefix:
          type: string
          enum: [kp_test_, kp_live_, kp_]
          description: '`kp_` for keys issued before apps replaced tenants. Display the key as `{prefix}…{last4}`.'
        last4:
          type: string
          minLength: 4
          maxLength: 4
        status:
          $ref: '#/components/schemas/ApiKeyStatus'
        last_used_at:
          type: [string, 'null']
          format: date-time
          description: Last successfully authenticated request; updated at most once a minute.
        expires_at:
          type: [string, 'null']
          format: date-time
        revoked_at:
          type: [string, 'null']
          format: date-time
        created_at:
          type: string
          format: date-time

    CreateApiKeyRequest:
      type: object
      required: [label]
      properties:
        label:
          $ref: '#/components/schemas/ApiKeyLabel'
        expires_at:
          type: [string, 'null']
          format: date-time
          description: Optional; must be in the future (rule `future`). Omitted or `null` means the key does not expire.

    ApiKeyResponse:
      type: object
      required: [key]
      properties:
        key:
          $ref: '#/components/schemas/ApiKey'

    ApiKeyListResponse:
      type: object
      required: [data, next_cursor]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ApiKey'
        next_cursor:
          type: [string, 'null']
          description: Pass as `cursor` to get the next page; `null` on the last page.

    ApiKeyCreatedResponse:
      type: object
      required: [key, api_key, api_secret]
      properties:
        key:
          $ref: '#/components/schemas/ApiKey'
        api_key:
          type: string
          description: The full API key for `X-Api-Key`. Shown once; KeiPay keeps only its hash.
        api_secret:
          type: string
          format: password
          description: The HMAC secret for `X-Signature`. Shown once; store it now.

    ProviderName:
      type: string
      pattern: '^[a-z][a-z0-9_]{1,31}$'
      description: |
        A provider adapter built into the server, e.g. `xendit`. The set
        is whatever `GET /admin/providers` returns; an unknown name is
        rejected with rule `oneof`.
      examples: [xendit]

    Channel:
      type: string
      pattern: '^[A-Z][A-Z0-9_]{1,39}$'
      description: |
        Normalized payment method code, e.g. `QRIS`, `VA_BCA`,
        `EWALLET_OVO`, `CARD`. The set a provider supports is in its
        `capabilities.channels`; new codes may be added.
      examples: [QRIS, VA_BCA]

    ChannelInfo:
      type: object
      required: [code, label]
      properties:
        code:
          $ref: '#/components/schemas/Channel'
        label:
          type: string
          description: Display name, e.g. `BCA Virtual Account`.

    SchemaFieldType:
      type: string
      description: |
        `string` (text; credentials are always strings), `integer`,
        `boolean`, or `enum` (one of `options[].value`, a string). New
        types may be added; a client that does not know a type should not
        offer the form.
      enum: [string, integer, boolean, enum]

    SchemaFieldOption:
      type: object
      required: [value, label]
      properties:
        value:
          type: string
        label:
          type: string

    SchemaField:
      type: object
      description: |
        One form field, in display order. Validation keywords mirror JSON
        Schema; the server enforces the same rules and reports violations
        as `credentials.<key>` or `settings.<key>` with the rule named
        after the keyword (`required`, `type`, `min_length`,
        `max_length`, `pattern`, `minimum`, `maximum`, `oneof`).
      required: [key, type, label, description, secret, required, default]
      properties:
        key:
          type: string
          pattern: '^[a-z][a-z0-9_]{0,63}$'
          examples: [secret_key]
        type:
          $ref: '#/components/schemas/SchemaFieldType'
        label:
          type: string
          examples: [Secret API key]
        description:
          type: string
          description: Help text shown under the field; may be empty.
        placeholder:
          type: string
          description: Example input; never a real value.
        secret:
          type: boolean
          description: Masked in forms, never returned, redacted from logs and audit entries.
        required:
          type: boolean
        default:
          description: Used when the value is omitted; `null` when there is none. Secret fields never have one.
          type: [string, integer, boolean, 'null']
        options:
          type: array
          description: Set for `enum` fields only.
          items:
            $ref: '#/components/schemas/SchemaFieldOption'
        min_length:
          type: integer
          minimum: 0
        max_length:
          type: integer
          minimum: 1
        pattern:
          type: string
          description: An RE2 regular expression the whole value must match (anchored).
        pattern_hint:
          type: string
          description: Human-readable form of `pattern` for error messages, e.g. "Starts with xnd_development_ or xnd_production_".
        minimum:
          type: integer
          format: int64
        maximum:
          type: integer
          format: int64

    ConfigSchema:
      type: object
      required: [fields]
      properties:
        fields:
          type: array
          items:
            $ref: '#/components/schemas/SchemaField'

    ProviderCapabilities:
      type: object
      required: [channels, currencies, can_restrict_channels, can_cancel, reports_fee]
      properties:
        channels:
          type: array
          description: Channels the provider can offer, in display order.
          items:
            $ref: '#/components/schemas/ChannelInfo'
        currencies:
          type: array
          description: ISO 4217 codes. Informational until routing uses it.
          items:
            type: string
            examples: [IDR]
        can_restrict_channels:
          type: boolean
          description: A checkout can be limited to chosen channels.
        can_cancel:
          type: boolean
          description: An unpaid checkout can be cancelled (expired).
        reports_fee:
          type: boolean
          description: Callbacks carry the gateway fee.

    ProviderWebhookSetup:
      type: object
      required: [instructions]
      properties:
        instructions:
          type: array
          description: Plain-text steps, in order, for pasting the connection's `webhook_url` into the gateway dashboard.
          items:
            type: string
        dashboard_url:
          type: string
          description: Where those settings live in the gateway dashboard.

    Provider:
      type: object
      required: [name, display_name, description, credential_schema, settings_schema, capabilities, webhook_setup]
      properties:
        name:
          $ref: '#/components/schemas/ProviderName'
        display_name:
          type: string
          examples: [Xendit]
        description:
          type: string
        docs_url:
          type: string
        credential_schema:
          $ref: '#/components/schemas/ConfigSchema'
        settings_schema:
          $ref: '#/components/schemas/ConfigSchema'
        capabilities:
          $ref: '#/components/schemas/ProviderCapabilities'
        webhook_setup:
          $ref: '#/components/schemas/ProviderWebhookSetup'

    ProviderListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Provider'

    ConnectionStatus:
      type: string
      description: '`disabled` connections create no new checkouts and cannot be an app default; their callbacks still work.'
      enum: [active, disabled]

    ConnectionTestStatus:
      type: string
      description: Outcome of the last `POST /admin/connections/{id}/test`.
      enum: [ok, failed]

    ConnectionName:
      type: string
      pattern: '^[a-z0-9][a-z0-9-]{1,62}[a-z0-9]$'
      description: |
        3-64 characters of `a-z`, `0-9` and `-`, starting and ending with
        a letter or digit (surrounding spaces are trimmed and upper case is
        lowered before checking). Unique across connections
        (`409 conflict`). Invalid: rule `slug`.
      examples: [xendit-live]

    ConnectionSummary:
      type: object
      description: The connection a row refers to.
      required: [id, name, provider, environment, status]
      properties:
        id:
          type: string
          pattern: '^con_[0-9A-HJKMNP-TV-Z]{26}$'
          examples: [con_01JBKQ7Z8M4X2Y6V3N9T5R1W0C]
        name:
          type: string
        provider:
          $ref: '#/components/schemas/ProviderName'
        environment:
          $ref: '#/components/schemas/AppEnvironment'
        status:
          $ref: '#/components/schemas/ConnectionStatus'

    ConnectionListItem:
      type: object
      required: [id, name, provider, environment, status, legacy_webhook_alias, last_tested_at, last_test_status, created_at, updated_at]
      properties:
        id:
          type: string
          pattern: '^con_[0-9A-HJKMNP-TV-Z]{26}$'
          examples: [con_01JBKQ7Z8M4X2Y6V3N9T5R1W0C]
        name:
          type: string
        provider:
          $ref: '#/components/schemas/ProviderName'
        environment:
          $ref: '#/components/schemas/AppEnvironment'
        status:
          $ref: '#/components/schemas/ConnectionStatus'
        legacy_webhook_alias:
          type: boolean
          description: '`true` for the connection imported from `XENDIT_*` settings; `POST /webhooks/xendit` also reaches it.'
        last_tested_at:
          type: [string, 'null']
          format: date-time
        last_test_status:
          oneOf:
            - $ref: '#/components/schemas/ConnectionTestStatus'
            - type: 'null'
          description: '`null` when never tested or since the credentials changed.'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CredentialHint:
      type: object
      required: [key, last4]
      properties:
        key:
          type: string
          description: A `credential_schema` field key.
        last4:
          type: [string, 'null']
          description: The last 4 characters of the stored value; `null` when the value is shorter than 12 characters.

    ConnectionChannel:
      type: object
      required: [channel, label, enabled]
      properties:
        channel:
          $ref: '#/components/schemas/Channel'
        label:
          type: string
        enabled:
          type: boolean

    Connection:
      description: A connection with everything except credential values.
      allOf:
        - $ref: '#/components/schemas/ConnectionListItem'
        - type: object
          required: [credentials, settings, channels, webhook_url, last_test_error]
          properties:
            credentials:
              type: array
              description: One hint per `credential_schema` field, in schema order. Values are never returned.
              items:
                $ref: '#/components/schemas/CredentialHint'
            settings:
              type: object
              additionalProperties: true
              description: Current settings, defaults filled in, keyed by `settings_schema` field.
            channels:
              type: array
              description: Every channel of the provider, in capability order, with whether this connection offers it.
              items:
                $ref: '#/components/schemas/ConnectionChannel'
            webhook_url:
              type: string
              description: '`{HTTP_BASE_URL}/webhooks/{provider}/{id}`. Paste it into the gateway dashboard.'
              examples: [https://pay.example.com/webhooks/xendit/con_01JBKQ7Z8M4X2Y6V3N9T5R1W0C]
            last_test_error:
              type: [string, 'null']
              description: Sanitized reason of the last failed test; `null` otherwise.

    CreateConnectionRequest:
      type: object
      required: [provider, name, environment, credentials]
      properties:
        provider:
          $ref: '#/components/schemas/ProviderName'
        name:
          $ref: '#/components/schemas/ConnectionName'
        environment:
          $ref: '#/components/schemas/AppEnvironment'
        credentials:
          type: object
          description: Values keyed by `credential_schema` field.
          additionalProperties:
            type: string
        settings:
          type: object
          description: Values keyed by `settings_schema` field; omitted means all defaults.
          additionalProperties: true

    UpdateConnectionRequest:
      type: object
      minProperties: 1
      description: |
        Send only the fields to change. `provider`, `environment` or
        `credentials` in the body returns `400 invalid_request` with rule
        `immutable`.
      properties:
        name:
          $ref: '#/components/schemas/ConnectionName'
        settings:
          type: object
          additionalProperties: true

    UpdateConnectionCredentialsRequest:
      type: object
      required: [credentials]
      properties:
        credentials:
          type: object
          minProperties: 1
          description: The values to replace, keyed by `credential_schema` field.
          additionalProperties:
            type: string

    ReplaceConnectionChannelsRequest:
      type: object
      required: [channels]
      properties:
        channels:
          type: array
          items:
            type: object
            required: [channel, enabled]
            properties:
              channel:
                $ref: '#/components/schemas/Channel'
              enabled:
                type: boolean

    ConnectionResponse:
      type: object
      required: [connection]
      properties:
        connection:
          $ref: '#/components/schemas/Connection'

    ConnectionListResponse:
      type: object
      required: [data, next_cursor]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ConnectionListItem'
        next_cursor:
          type: [string, 'null']
          description: Pass as `cursor` to get the next page; `null` on the last page.

    ConnectionTestResponse:
      type: object
      required: [result, message, tested_at, connection]
      properties:
        result:
          $ref: '#/components/schemas/ConnectionTestStatus'
        message:
          type: string
          description: Short, sanitized outcome, e.g. "Credentials accepted." or "The provider rejected the credentials (HTTP 401)."
        tested_at:
          type: string
          format: date-time
        connection:
          $ref: '#/components/schemas/Connection'

    Payment:
      type: object
      required: [id, reference, app, order_id, xendit_invoice_id, amount, currency, status, description, invoice_url, payer_email, items, metadata, expires_at, paid_at, settled_at, expected_settlement_at, created_at, updated_at]
      properties:
        id:
          type: string
          pattern: '^pay_[0-9A-HJKMNP-TV-Z]{26}$'
          examples: [pay_01JBKQ7Z8M4X2Y6V3N9T5R1W0C]
        reference:
          type: string
          description: The gateway reference (Xendit `external_id`); `kp_pay_…`, or `{slug}:{order_id}` for older payments.
        app:
          $ref: '#/components/schemas/AppSummary'
        order_id:
          type: string
        xendit_invoice_id:
          type: string
        amount:
          type: integer
          format: int64
        currency:
          type: string
        status:
          $ref: '#/components/schemas/PaymentStatus'
        description:
          type: string
        invoice_url:
          type: string
        payer_email:
          type: string
        items:
          type: array
          description: Empty when the order had no items.
          items:
            $ref: '#/components/schemas/OrderItem'
        metadata:
          $ref: '#/components/schemas/Metadata'
        expires_at:
          type: [string, 'null']
          format: date-time
        paid_at:
          type: [string, 'null']
          format: date-time
        settled_at:
          type: [string, 'null']
          format: date-time
        expected_settlement_at:
          type: [string, 'null']
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    PaymentListResponse:
      type: object
      required: [data, next_cursor]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Payment'
        next_cursor:
          type: [string, 'null']
          description: Pass as `cursor` to get the next page; `null` on the last page.

    LedgerEntry:
      type: object
      required: [id, app, payment_id, amount, xendit_fee, net_amount, type, created_at]
      properties:
        id:
          type: integer
          format: int64
        app:
          $ref: '#/components/schemas/AppSummary'
        payment_id:
          type: string
          pattern: '^pay_[0-9A-HJKMNP-TV-Z]{26}$'
        amount:
          type: integer
          format: int64
        xendit_fee:
          type: integer
          format: int64
        net_amount:
          type: integer
          format: int64
        type:
          type: string
          enum: [PAYMENT, REFUND]
        settled_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time

    LedgerSummary:
      type: object
      required: [app, count, gross_amount, total_fee, net_amount]
      properties:
        app:
          $ref: '#/components/schemas/AppSummary'
        count:
          type: integer
          format: int64
        gross_amount:
          type: integer
          format: int64
        total_fee:
          type: integer
          format: int64
        net_amount:
          type: integer
          format: int64

    LedgerListResponse:
      type: object
      required: [entries, summary]
      properties:
        entries:
          type: array
          items:
            $ref: '#/components/schemas/LedgerEntry'
        summary:
          type: array
          items:
            $ref: '#/components/schemas/LedgerSummary'

    EventTypeInfo:
      type: object
      required: [type, description, example]
      properties:
        type:
          $ref: '#/components/schemas/EventType'
        description:
          type: string
          description: One sentence for people choosing subscriptions.
        example:
          $ref: '#/components/schemas/WebhookEnvelope'

    EventWildcard:
      type: object
      required: [pattern, description]
      properties:
        pattern:
          type: string
          description: A subscription entry that matches several types.
          examples: ['payment.*', '*']
        description:
          type: string

    EventTypeListResponse:
      type: object
      required: [data, wildcards]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/EventTypeInfo'
        wildcards:
          type: array
          description: '`payment.*` (every `payment.` type) and `*` (every type, including ones added later), in that order.'
          items:
            $ref: '#/components/schemas/EventWildcard'

    EventSubscription:
      type: string
      description: |
        An event type from the catalog, a group wildcard (`<group>.*` for a
        group in the catalog, e.g. `payment.*`) or `*`. Surrounding spaces
        are trimmed. Anything else: rule `oneof`.
      maxLength: 64
      examples: [payment.paid, 'payment.*', '*']

    WebhookApiVersion:
      type: string
      description: |
        The body an endpoint receives. `v2`: `WebhookEnvelope`. `v1`: the
        older flat `PaymentWebhookEvent`, for endpoints migrated from an
        app's `webhook_url`.
      enum: [v1, v2]

    WebhookEndpointStatus:
      type: string
      enum: [active, disabled]

    WebhookEndpointDisabledReason:
      type: string
      description: '`manual` (disabled through the API) or `consecutive_failures` (disabled automatically).'
      enum: [manual, consecutive_failures]

    WebhookRetryPolicy:
      type: object
      description: |
        How many times one delivery is attempted and how long to wait
        between attempts. With `exponential` the wait after attempt `n` is
        `interval_seconds × 2^(n-1)`, capped at 6 hours; with `fixed` it is
        `interval_seconds`. The default (8 attempts, exponential, 30 s)
        spans about an hour. Out of range: rule `min` or `max` on
        `retry_policy.<field>`; unknown `backoff`: rule `oneof`.
      required: [max_attempts, backoff, interval_seconds]
      properties:
        max_attempts:
          type: integer
          minimum: 1
          maximum: 20
          default: 8
        backoff:
          type: string
          enum: [exponential, fixed]
          default: exponential
        interval_seconds:
          type: integer
          minimum: 10
          maximum: 3600
          default: 30

    WebhookHeaderInput:
      type: object
      required: [name, value]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
          description: |
            An HTTP header name (RFC 9110 token characters). Not allowed
            (rule `reserved`, case-insensitive): `Content-Type`,
            `Content-Length`, `Host`, `User-Agent`, `Connection`,
            `Transfer-Encoding`, and any name starting with `X-KeiPay-` or
            `X-Kei-`. Invalid characters: rule `header_name`. Repeated
            name (case-insensitive): rule `duplicate`.
          examples: [Authorization]
        value:
          type: string
          minLength: 1
          maxLength: 1024
          format: password
          description: Stored encrypted and never returned. Control characters (including CR and LF) are rejected with rule `header_value`.

    WebhookHeaderHint:
      type: object
      required: [name, value_last4]
      properties:
        name:
          type: string
        value_last4:
          type: [string, 'null']
          description: Last 4 characters of the value; `null` when the value is shorter than 12 characters.

    WebhookEndpoint:
      type: object
      required: [id, app, url, description, events, api_version, legacy_signature, headers, retry_policy, status, disabled_reason, disabled_at, consecutive_failures, secret_last4, previous_secret_expires_at, migrated, created_at, updated_at]
      properties:
        id:
          type: string
          pattern: '^whe_[0-9A-HJKMNP-TV-Z]{26}$'
          examples: [whe_01JBKQ7Z8M4X2Y6V3N9T5R1W0C]
        app:
          $ref: '#/components/schemas/AppSummary'
        url:
          type: string
        description:
          type: string
        events:
          type: array
          description: The subscriptions, in the order they were saved.
          items:
            $ref: '#/components/schemas/EventSubscription'
        api_version:
          $ref: '#/components/schemas/WebhookApiVersion'
        legacy_signature:
          type: boolean
          description: Whether requests also carry `X-Kei-Signature` and `X-Kei-Event`.
        headers:
          type: array
          description: Custom headers, names only plus a hint of each value.
          items:
            $ref: '#/components/schemas/WebhookHeaderHint'
        retry_policy:
          $ref: '#/components/schemas/WebhookRetryPolicy'
        status:
          $ref: '#/components/schemas/WebhookEndpointStatus'
        disabled_reason:
          description: Set exactly when `status` is `disabled`.
          oneOf:
            - $ref: '#/components/schemas/WebhookEndpointDisabledReason'
            - type: 'null'
        disabled_at:
          type: [string, 'null']
          format: date-time
        consecutive_failures:
          type: integer
          minimum: 0
          description: Deliveries in a row that ran out of attempts; reset by any successful attempt and by enabling.
        secret_last4:
          type: [string, 'null']
          description: Last 4 characters of the current signing secret; `null` for a secret carried over from an app's former webhook settings until it is rotated.
        previous_secret_expires_at:
          type: [string, 'null']
          format: date-time
          description: While set and in the future, the previous secret still signs requests.
        migrated:
          type: boolean
          description: Created from the app's former `webhook_url` when webhook endpoints were introduced.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateWebhookEndpointRequest:
      type: object
      required: [url, events]
      properties:
        url:
          type: string
          maxLength: 2048
          description: |
            An absolute `http` or `https` URL with a host, at most 2048
            bytes, without whitespace or control characters. Blank: rule
            `required`; invalid: rule `url`; `http` for an app in the
            `live` environment: rule `https`.
          examples: [https://shop.example.com/hooks/keipay]
        description:
          type: string
          maxLength: 500
          description: Free text, trimmed; at most 500 characters (rule `max`), no control characters other than newline and tab (rule `name`).
        events:
          type: array
          minItems: 1
          maxItems: 20
          description: |
            Subscriptions. Empty: rule `required`; more than 20: rule
            `max`; per element `events.<i>` rule `oneof` or `duplicate`.
          items:
            $ref: '#/components/schemas/EventSubscription'
        api_version:
          $ref: '#/components/schemas/WebhookApiVersion'
        legacy_signature:
          type: boolean
          default: false
        headers:
          type: array
          maxItems: 10
          description: More than 10 entries returns rule `max` on `headers`. Element errors use `headers.<i>.name` or `headers.<i>.value`.
          items:
            $ref: '#/components/schemas/WebhookHeaderInput'
        retry_policy:
          $ref: '#/components/schemas/WebhookRetryPolicy'

    UpdateWebhookEndpointRequest:
      type: object
      minProperties: 1
      description: Send only the fields to change. Rules as on create.
      properties:
        url:
          type: string
          maxLength: 2048
        description:
          type: string
          maxLength: 500
        events:
          type: array
          minItems: 1
          maxItems: 20
          items:
            $ref: '#/components/schemas/EventSubscription'
        api_version:
          $ref: '#/components/schemas/WebhookApiVersion'
        legacy_signature:
          type: boolean
        headers:
          type: array
          maxItems: 10
          description: Replaces every custom header; `[]` removes them all.
          items:
            $ref: '#/components/schemas/WebhookHeaderInput'
        retry_policy:
          $ref: '#/components/schemas/WebhookRetryPolicy'

    RotateWebhookSecretRequest:
      type: object
      properties:
        overlap_hours:
          type: integer
          minimum: 0
          maximum: 168
          default: 24
          description: How long the current secret keeps signing next to the new one. Out of range or not an integer returns `400 invalid_request` with rule `min`, `max` or `type`.

    SendTestEventRequest:
      type: object
      required: [event_type]
      properties:
        event_type:
          $ref: '#/components/schemas/EventType'

    WebhookEndpointResponse:
      type: object
      required: [endpoint]
      properties:
        endpoint:
          $ref: '#/components/schemas/WebhookEndpoint'

    WebhookEndpointSecretResponse:
      type: object
      required: [endpoint, secret]
      properties:
        endpoint:
          $ref: '#/components/schemas/WebhookEndpoint'
        secret:
          type: string
          format: password
          description: The signing secret (`kpwh_` + 48 hex characters). Shown once; store it now.
          examples: [kpwh_3f9a0c1d2e4b5a69788796a5b4c3d2e1f0a9b8c7d6e5f4a3]

    WebhookEndpointListResponse:
      type: object
      required: [data, next_cursor]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/WebhookEndpoint'
        next_cursor:
          type: [string, 'null']
          description: Pass as `cursor` to get the next page; `null` on the last page.

    WebhookEnvelope:
      type: object
      description: The `v2` webhook body. Fields are only ever added within `v2`.
      required: [id, type, api_version, created_at, data]
      properties:
        id:
          type: string
          pattern: '^evt_[0-9A-HJKMNP-TV-Z]{26}$'
          description: The event id; the same for every endpoint and every attempt. Dedupe on it.
          examples: [evt_01JBKQ7Z8M4X2Y6V3N9T5R1W0C]
        type:
          $ref: '#/components/schemas/EventType'
        api_version:
          type: string
          const: v2
        created_at:
          type: string
          format: date-time
          description: When the event happened in KeiPay (not when this attempt was sent).
        data:
          $ref: '#/components/schemas/PaymentEventData'

    PaymentEventData:
      type: object
      description: The payment as of the event.
      required: [id, order_id, reference, status, amount, currency, metadata, provider, connection_id, paid_at, settled_at]
      properties:
        id:
          type: string
          pattern: '^pay_[0-9A-HJKMNP-TV-Z]{26}$'
          examples: [pay_01JBKQ7Z8M4X2Y6V3N9T5R1W0C]
        order_id:
          type: string
        reference:
          type: string
          description: The gateway reference (`reference` on the payment).
        status:
          $ref: '#/components/schemas/PaymentStatus'
        amount:
          type: integer
          format: int64
          description: Minor units (whole rupiah for IDR).
        currency:
          type: string
        metadata:
          $ref: '#/components/schemas/Metadata'
        provider:
          oneOf:
            - $ref: '#/components/schemas/ProviderName'
            - type: 'null'
        connection_id:
          type: [string, 'null']
          pattern: '^con_[0-9A-HJKMNP-TV-Z]{26}$'
        paid_at:
          type: [string, 'null']
          format: date-time
        settled_at:
          type: [string, 'null']
          format: date-time

    WebhookDeliveryStatus:
      type: string
      description: |
        `PENDING`: waiting for its next attempt (`next_attempt_at`).
        `DELIVERED`: an attempt got a `2xx`. `FAILED`: attempts ran out, or
        the endpoint was disabled or deleted before the next attempt.
      enum: [PENDING, DELIVERED, FAILED]

    WebhookEndpointRef:
      type: object
      description: The endpoint a delivery went to.
      required: [id, url, description, deleted]
      properties:
        id:
          type: string
          pattern: '^whe_[0-9A-HJKMNP-TV-Z]{26}$'
        url:
          type: string
        description:
          type: string
        deleted:
          type: boolean

    EventRef:
      type: object
      required: [id, type, test]
      properties:
        id:
          type: string
          pattern: '^evt_[0-9A-HJKMNP-TV-Z]{26}$'
        type:
          $ref: '#/components/schemas/EventType'
        test:
          type: boolean
          description: A test send, not a real payment change.

    WebhookDelivery:
      type: object
      required: [id, app, endpoint, event, event_type, payment_id, status, attempts, max_attempts, next_attempt_at, last_attempt_at, last_response_status, last_error, created_at, updated_at]
      properties:
        id:
          type: string
          pattern: '^dlv_[0-9A-HJKMNP-TV-Z]{26}$'
          examples: [dlv_01JBKQ7Z8M4X2Y6V3N9T5R1W0C]
        app:
          $ref: '#/components/schemas/AppSummary'
        endpoint:
          description: '`null` for a delivery from before webhook endpoints whose app had no webhook URL.'
          oneOf:
            - $ref: '#/components/schemas/WebhookEndpointRef'
            - type: 'null'
        event:
          description: '`null` for a delivery from before events existed.'
          oneOf:
            - $ref: '#/components/schemas/EventRef'
            - type: 'null'
        event_type:
          $ref: '#/components/schemas/EventType'
        payment_id:
          type: [string, 'null']
          pattern: '^pay_[0-9A-HJKMNP-TV-Z]{26}$'
          description: '`null` for test sends.'
        status:
          $ref: '#/components/schemas/WebhookDeliveryStatus'
        attempts:
          type: integer
          minimum: 0
          description: Attempts made so far, replays included.
        max_attempts:
          type: integer
          minimum: 0
          description: Attempts allowed before the delivery fails; a replay allows exactly one more.
        next_attempt_at:
          type: [string, 'null']
          format: date-time
          description: Set while `PENDING`.
        last_attempt_at:
          type: [string, 'null']
          format: date-time
        last_response_status:
          type: [integer, 'null']
          description: HTTP status of the last attempt; `null` when it got no response (timeout, connection error) or none was made.
        last_error:
          type: string
          description: Why the last attempt or the delivery failed; empty after success.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    WebhookDeliveryAttempt:
      type: object
      required: [attempt, manual, url, request_headers, response_status, response_body, response_body_truncated, error, duration_ms, started_at]
      properties:
        attempt:
          type: integer
          minimum: 1
        manual:
          type: boolean
          description: Made by a replay.
        url:
          type: string
        request_headers:
          type: object
          description: Headers sent; custom header values are `[REDACTED]`.
          additionalProperties:
            type: string
        response_status:
          type: [integer, 'null']
        response_body:
          type: string
          description: The first 4096 bytes of the response body as text (invalid UTF-8 replaced).
        response_body_truncated:
          type: boolean
        error:
          type: string
          description: Network or protocol error, or `unexpected status 500` style text; empty on success.
        duration_ms:
          type: integer
          minimum: 0
        started_at:
          type: string
          format: date-time

    WebhookDeliveryDetail:
      allOf:
        - $ref: '#/components/schemas/WebhookDelivery'
        - type: object
          required: [payload, attempt_log]
          properties:
            payload:
              type: object
              additionalProperties: true
              description: The body as sent (`WebhookEnvelope` or `PaymentWebhookEvent`, by the endpoint's version when the delivery was created).
            attempt_log:
              type: array
              description: Oldest first. Empty for deliveries made before attempts were logged.
              items:
                $ref: '#/components/schemas/WebhookDeliveryAttempt'

    WebhookDeliveryResponse:
      type: object
      required: [delivery]
      properties:
        delivery:
          $ref: '#/components/schemas/WebhookDelivery'

    WebhookDeliveryDetailResponse:
      type: object
      required: [delivery]
      properties:
        delivery:
          $ref: '#/components/schemas/WebhookDeliveryDetail'

    DeliveryListResponse:
      type: object
      required: [data, next_cursor]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/WebhookDelivery'
        next_cursor:
          type: [string, 'null']
          description: Pass as `cursor` to get the next page; `null` on the last page.

    InboundWebhookResult:
      type: string
      description: |
        What KeiPay did with a callback.

        | result | HTTP | meaning |
        |---|---|---|
        | `applied` | 200 | Moved the payment forward and created an event. |
        | `stale` | 200 | Valid, but not a forward move (e.g. `PAID` after `SETTLED`). |
        | `duplicate` | 200 | The same event key and gateway status already reached this connection. |
        | `mismatch` | 200 | Amount or currency differs from the payment, or the payment belongs to another connection. Not applied; security event. |
        | `unmapped` | 200 | A gateway status KeiPay does not know. Not applied. |
        | `invalid_signature` | 401 | Verification with the connection's credentials failed. |
        | `invalid_payload` | 400 | The body is not a callback this provider sends. |
        | `error` | 500 | Processing failed (e.g. unknown payment reference); the gateway retries. |
      enum: [applied, stale, duplicate, mismatch, unmapped, invalid_signature, invalid_payload, error]

    InboundWebhook:
      type: object
      required: [id, connection, provider, source, signature_valid, result, result_detail, event_key, provider_status, reference, payment_id, event, received_at]
      properties:
        id:
          type: string
          pattern: '^inb_[0-9A-HJKMNP-TV-Z]{26}$'
          examples: [inb_01JBKQ7Z8M4X2Y6V3N9T5R1W0C]
        connection:
          $ref: '#/components/schemas/ConnectionSummary'
        provider:
          $ref: '#/components/schemas/ProviderName'
        source:
          type: string
          description: '`webhook` (a gateway callback). Other sources may be added.'
          enum: [webhook]
        signature_valid:
          type: boolean
        result:
          $ref: '#/components/schemas/InboundWebhookResult'
        result_detail:
          type: string
          description: A short explanation, e.g. which field mismatched; may be empty. Never contains secrets.
        event_key:
          type: [string, 'null']
          description: The gateway's event key (Xendit invoice id); `null` when the body could not be read or verification failed.
        provider_status:
          type: [string, 'null']
          description: The gateway's own status value.
        reference:
          type: [string, 'null']
          description: The payment reference the callback names.
        payment_id:
          type: [string, 'null']
          pattern: '^pay_[0-9A-HJKMNP-TV-Z]{26}$'
          description: The payment it was matched to, when one was found.
        event:
          description: The event an `applied` callback created.
          oneOf:
            - $ref: '#/components/schemas/EventRef'
            - type: 'null'
        received_at:
          type: string
          format: date-time

    InboundWebhookDetail:
      allOf:
        - $ref: '#/components/schemas/InboundWebhook'
        - type: object
          required: [raw_body, raw_body_truncated]
          properties:
            raw_body:
              type: string
              description: The body exactly as received, as text (invalid UTF-8 replaced). Usually JSON.
            raw_body_truncated:
              type: boolean
              description: Bodies that failed verification are stored cut to 4096 bytes.

    InboundWebhookListResponse:
      type: object
      required: [data, next_cursor]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/InboundWebhook'
        next_cursor:
          type: [string, 'null']
          description: Pass as `cursor` to get the next page; `null` on the last page.

    InboundWebhookDetailResponse:
      type: object
      required: [inbound_webhook]
      properties:
        inbound_webhook:
          $ref: '#/components/schemas/InboundWebhookDetail'

    PaymentWebhookEvent:
      type: object
      description: The `v1` webhook body (endpoints with `api_version` `v1`).
      required: [event, payment_id, order_id, external_id, status, amount, currency, timestamp]
      properties:
        event:
          $ref: '#/components/schemas/EventType'
        event_id:
          type: string
          pattern: '^evt_[0-9A-HJKMNP-TV-Z]{26}$'
          description: The event id, also in `X-KeiPay-Event-Id`. Dedupe on it. Missing only in deliveries made before events existed.
        payment_id:
          type: integer
          format: int64
          description: Legacy integer id (`0` on test sends). Prefer `payment_public_id`.
        payment_public_id:
          type: string
          pattern: '^pay_[0-9A-HJKMNP-TV-Z]{26}$'
          description: The payment's `pay_…` id.
        order_id:
          type: string
        external_id:
          type: string
          description: The gateway reference (same as `reference` on the payment).
        metadata:
          $ref: '#/components/schemas/Metadata'
          description: The payment's `metadata`, `{}` when none.
        status:
          $ref: '#/components/schemas/PaymentStatus'
        amount:
          type: integer
          format: int64
        currency:
          type: string
        paid_at:
          type: string
          format: date-time
        settled_at:
          type: string
          format: date-time
        timestamp:
          type: string
          format: date-time
          description: When the event was created (the event's `created_at`).

    AuditActor:
      type: object
      required: [type, id]
      properties:
        type:
          type: string
          description: |
            `admin` (a signed-in console user of any role), `system` (seed,
            CLI, setup, background job) or `anonymous` (a failed sign-in).
          examples: [admin, system, anonymous]
        id:
          type: string
          description: |
            The user's `usr_…` id for `admin`; the component name (`seed`,
            `cli`, `setup`, `import`, `worker`) for `system`; `anonymous`
            for `anonymous`.
            Entries written before users existed carry the admin username.

    AuditTarget:
      type: object
      required: [type, id]
      properties:
        type:
          type: string
          description: Entries written before users existed use `admin_user` for the console admin; entries written before apps existed use `tenant` with the integer tenant id.
          examples: [app, api_key, connection, user, webhook_endpoint, webhook_delivery]
        id:
          type: string
          description: The target's identifier as a string (`app_…`, `key_…`, `usr_…`, `whe_…`, `dlv_…`). Empty for a failed sign-in with an unknown email. Replays recorded before deliveries had public ids carry the integer delivery id.

    AuditLog:
      type: object
      required: [id, occurred_at, actor, action, target, before, after, ip, user_agent, request_id]
      properties:
        id:
          type: string
          pattern: '^aud_[0-9A-HJKMNP-TV-Z]{26}$'
          examples: [aud_01JBKQ7Z8M4X2Y6V3N9T5R1W0C]
        occurred_at:
          type: string
          format: date-time
        actor:
          $ref: '#/components/schemas/AuditActor'
        action:
          type: string
          description: |
            `{target_type}.{verb}`. Current values: `app.create`,
            `app.update`, `app.disable`, `app.enable`, `api_key.create`,
            `api_key.rotate`, `api_key.revoke`, `connection.create`,
            `connection.update`, `connection.update_credentials`,
            `connection.update_channels`, `connection.disable`,
            `connection.enable`, `connection.test`,
            `webhook_endpoint.create`, `webhook_endpoint.update`,
            `webhook_endpoint.delete`, `webhook_endpoint.rotate_secret`,
            `webhook_endpoint.disable`, `webhook_endpoint.enable`,
            `webhook_endpoint.auto_disable` (actor `system:worker`),
            `webhook_endpoint.test`, `webhook_delivery.replay`,
            `user.setup`, `user.create`, `user.update`, `user.disable`,
            `user.enable`, `user.reset_password`, `user.change_password`,
            `user.login`, `user.login_failed`, `user.logout`. Older entries
            may carry `tenant.create`, `tenant.update`,
            `tenant.rotate_credentials` or `admin_user.change_password`. New
            actions may be added.
          examples: [app.update]
        target:
          $ref: '#/components/schemas/AuditTarget'
        before:
          description: Snapshot before the change, without secrets; `null` on create.
          type: [object, 'null']
          additionalProperties: true
        after:
          description: Snapshot after the change, without secrets; `null` when nothing persistent changed.
          type: [object, 'null']
          additionalProperties: true
        ip:
          type: string
          description: Client IP, empty for system actors.
        user_agent:
          type: string
        request_id:
          type: string

    AuditLogListResponse:
      type: object
      required: [data, next_cursor]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AuditLog'
        next_cursor:
          type: [string, 'null']
          description: Pass as `cursor` to get the next page; `null` on the last page.

security:
  - adminSession: []
