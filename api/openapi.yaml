openapi: 3.1.0
info:
  title: KeiPay API
  version: 0.1.0
  summary: Self-hosted payment orchestrator.
  description: |
    KeiPay gives your apps one API and one credential for payment gateways.
    This document is the source of truth for the HTTP contract. Frontend
    types are generated from it (`make gen`); do not hand-write them.

    ## Surfaces

    - `/v1/*`: the app API, authenticated with an app API key and an
      HMAC-SHA256 signature (see App API keys).
    - `/webhooks/*`: inbound gateway callbacks. Every callback lives below
      `/webhooks/`; `GET /webhooks` itself is the console's Webhooks page.
    - `/admin/*`: the admin console API, authenticated with a session
      cookie and protected against CSRF (see Admin authentication).
    - `/healthz`: liveness.

    Every response carries an `X-Request-ID` header. Send your own
    `X-Request-ID` to correlate logs; otherwise KeiPay generates one.

    ## Errors

    Every error response, on every surface, has the same shape:

    ```json
    {"error": {"code": "not_found", "message": "not found", "details": {}}}
    ```

    `code` is stable and listed in `ErrorCode`; branch on it. `message` is
    for humans and may change. `details` is always an object; it is empty
    unless a code documents its keys.

    ## Pagination

    New list endpoints use cursor pagination: `limit` (1-200, default 50)
    and an opaque `cursor`; the response carries `data` and `next_cursor`
    (`null` on the last page). Two older admin lists (`/admin/ledger`,
    `/admin/webhook-deliveries`) still use `limit` and `offset` and move
    to cursors when their features are reworked.

    ## Identifiers

    Resources are identified by prefixed public ids: `app_…` (app),
    `key_…` (API key), `pay_…` (payment), `usr_…` (user), `aud_…` (audit
    entry). The part after the prefix is a ULID; lower case is accepted.
    Internal integer ids are not exposed, with three exceptions kept for
    existing integrations: the `payment_id` field of `/v1` payments and
    webhook events, and the ids of ledger entries and webhook deliveries
    (the replay endpoint uses the latter).

    ## App API keys

    Each app has one environment, `test` or `live`, fixed at creation, and
    any number of API keys, at most 10 of them usable (not revoked, not
    expired) at a time. A key is an identifier plus a signing secret:

    - API key, sent as `X-Api-Key`: `kp_test_` or `kp_live_` (the app's
      environment) followed by 32 lower-case hex characters. Keys issued
      before apps replaced tenants keep their `kp_` + 32 hex form and act
      in their app's environment. KeiPay stores only a SHA-256 hash of the
      key and afterwards shows its prefix and last 4 characters.
    - API secret: `kps_test_` or `kps_live_` followed by 48 hex
      characters; the HMAC key for `X-Signature`. Stored encrypted.

    Both are shown once, when the key is created or rotated. The key
    alone decides the app and its environment; nothing in a request body
    or path can point at another app. A key stays usable until it is
    revoked or its optional `expires_at` passes. Rotating a key creates a
    new key and secret with the same label and leaves the old key valid
    until you revoke it: deploy the new pair, then revoke the old one.

    `/v1` checks, in order: the three headers, the timestamp window, the
    key (`401 unknown_api_key`), the signature (`401 invalid_signature`),
    then the key's state (`401 api_key_revoked`, `401 api_key_expired`)
    and the app's (`403 tenant_inactive` when the app is disabled), and
    finally replay (`401 replayed_request`). Key and app state are only
    reported to callers that signed with the key's secret.

    Outbound webhooks are signed with the app's webhook signing secret
    (`kpwh_` + 48 hex characters, shown once when the app is created),
    which is separate from its API keys so rotating keys never breaks
    webhook verification. Apps that existed before apps replaced tenants
    keep their original `api_secret` as their webhook signing secret.

    ## Idempotency

    `POST /v1/payments` is idempotent per `order_id` within the app.
    Optionally send `Idempotency-Key` as well (1-255 printable ASCII
    characters, no spaces). The key is checked first: the same key with
    the same request returns the original payment; the same key with a
    different request returns `409 idempotency_key_reused`. Without a key
    match, a repeated `order_id` with the same amount and currency returns
    the original payment, and with a different amount or currency
    `409 conflict`. Replays are answered with `201` and
    `Idempotent-Replayed: true`. Keys are stored with the payment and do
    not expire. Different apps may use the same `order_id` or key.

    ## Admin authentication

    On first run, while no user exists, `POST /admin/setup` creates the
    first owner. After that, users sign in with `POST /admin/login`. Both
    set two cookies:

    - `keipay_session`: an opaque session id. `HttpOnly`, `SameSite=Lax`,
      `Path=/`, no `Expires`, and `Secure` unless the server's
      `COOKIE_SECURE` resolves to false (it does by default only when
      `APP_ENV=development`). The session lives in Redis and ends after
      `SESSION_IDLE_TIMEOUT` (default 30m) without requests or
      `SESSION_ABSOLUTE_TIMEOUT` (default 12h) after sign-in, whichever
      comes first. Logging out, disabling the user, an owner resetting the
      user's password, and the user changing their password end the
      user's other sessions immediately.
    - `keipay_csrf`: the CSRF token, readable by scripts (not `HttpOnly`),
      same `SameSite`, `Path` and `Secure` rules. Every `/admin/*` response
      sets it when the request did not carry one; signing in, setup,
      changing the password and logging out replace it.

    Every `POST`, `PUT`, `PATCH` and `DELETE` under `/admin/` must send the
    current `keipay_csrf` value in the `X-CSRF-Token` header. With a valid
    session the header must also equal the token bound to that session.
    A missing or wrong token returns `403 invalid_csrf_token`. Fetch
    `GET /admin/setup` (public) first if the cookie is not set yet.

    A signed-in user whose `must_change_password` is true may only call
    `GET /admin/me`, `POST /admin/me/password` and `POST /admin/logout`;
    every other admin operation returns `403 password_change_required`.

    Failed sign-ins are rate limited per client IP (default 20) and per
    email (default 5) in a 15-minute window. Over the limit, login returns
    `429 rate_limited` with `Retry-After` before checking the password.
    The client IP is the TCP peer unless it is listed in `TRUSTED_PROXIES`.

    ## Roles and permissions

    Each user has one role. The server checks the permission named by an
    operation's `x-keipay-permission` and returns `403 forbidden` when the
    caller's role lacks it. Admin operations without the extension are open
    to every signed-in user, or public when their `security` is empty.

    | permission | owner | admin | viewer |
    |---|---|---|---|
    | `apps:read` | yes | yes | yes |
    | `apps:write` | yes | yes | no |
    | `payments:read` | yes | yes | yes |
    | `deliveries:read` | yes | yes | yes |
    | `deliveries:replay` | yes | yes | no |
    | `audit:read` | yes | yes | no |
    | `users:manage` | yes | no | no |

    `GET /admin/me` returns the caller's permissions, so clients never
    hard-code this table. New permissions may be added.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: /
    description: The KeiPay deployment serving this document (same origin).
tags:
  - name: health
    description: Liveness.
  - name: payments
    description: App API for payments.
  - name: gateway-webhooks
    description: Inbound callbacks from payment gateways.
  - name: admin-auth
    description: First-run setup, sign-in, sessions and the signed-in user's account.
  - name: admin-users
    description: Console users and roles (owner only).
  - name: admin-apps
    description: Apps, their API keys and settings.
  - name: admin-payments
    description: Payment and ledger reporting.
  - name: admin-webhooks
    description: Outbound webhook deliveries to apps.
  - name: admin-audit
    description: Audit trail of admin mutations.

paths:
  /healthz:
    get:
      tags: [health]
      operationId: getHealth
      summary: Liveness probe
      security: []
      responses:
        '200':
          description: The process is up.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /v1/payments:
    post:
      tags: [payments]
      operationId: createPayment
      summary: Create a payment
      description: |
        Creates a hosted checkout on the gateway and returns its URL.
        Idempotent per `order_id` within the app, and per `Idempotency-Key`
        when sent (see Idempotency): a replay returns the original payment
        with `201` and `Idempotent-Replayed: true`; a repeated `order_id`
        with a different amount or currency returns `409 conflict`; a
        repeated `Idempotency-Key` with a different request returns
        `409 idempotency_key_reused`. An expired payment is returned as-is,
        so use a new `order_id` to retry.

        The gateway reference (`reference`, Xendit `external_id`) is
        `kp_` + the payment id, for example `kp_pay_01JB…`. `metadata` is
        stored with the payment, returned by `GET` and sent back in every
        webhook event for it.

        A body that breaks the schema, including any entry of `items` or
        `metadata`, returns `400 invalid_request` with `details.fields`
        (for example `items.0.quantity` or `metadata.note`).
        `400 validation_failed` is for business rules.
      security:
        - appApiKey: []
          appTimestamp: []
          appSignature: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePaymentRequest'
      responses:
        '201':
          description: Payment created, or the existing payment for this `order_id` or `Idempotency-Key`.
          headers:
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/payments/{id}:
    get:
      tags: [payments]
      operationId: getPayment
      summary: Get a payment
      description: Returns a payment of the calling app, by `pay_…` id or legacy integer id. Sign an empty body.
      security:
        - appApiKey: []
          appTimestamp: []
          appSignature: []
      parameters:
        - $ref: '#/components/parameters/PaymentIdPath'
      responses:
        '200':
          description: The payment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /webhooks/xendit:
    post:
      tags: [gateway-webhooks]
      operationId: receiveXenditInvoiceCallback
      summary: Receive a Xendit invoice callback
      description: |
        Configure this URL in the Xendit dashboard. Duplicate and stale
        callbacks, and callbacks whose amount or currency does not match the
        payment, are acknowledged with `200` so Xendit stops retrying; real
        processing failures return `500` so Xendit retries.
      security:
        - xenditCallbackToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/XenditInvoiceCallback'
      responses:
        '200':
          description: Accepted (applied, duplicate, stale or recorded mismatch).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReceivedResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /admin/setup:
    get:
      tags: [admin-auth]
      operationId: getSetupStatus
      summary: First-run setup status
      description: |
        Public. `setup_required` is true while no user exists. Like every
        `/admin/*` response it sets the `keipay_csrf` cookie when the request
        has none, so the console calls it before its first `POST`.
      security: []
      responses:
        '200':
          description: Setup status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetupStatusResponse'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [admin-auth]
      operationId: completeSetup
      summary: Create the first owner
      description: |
        Works only while no user exists; afterwards it returns
        `409 setup_completed`. Concurrent calls are serialized, so exactly
        one succeeds. Creates an active `owner` with the given password
        (`must_change_password` false), signs them in, and records
        `user.setup` (actor `system:setup`).

        When the server has `SETUP_TOKEN` set, `setup_token` must equal it;
        otherwise the call returns `403 invalid_setup_token` and counts as a
        failed attempt for the client IP. Checks run in this order: body
        (`400`), IP rate limit (`429`), already set up (`409`), setup token
        (`403`).
      security:
        - csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetupRequest'
      responses:
        '201':
          description: The owner exists and is signed in.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SessionCookies'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /admin/login:
    post:
      tags: [admin-auth]
      operationId: adminLogin
      summary: Sign in
      description: |
        Email is matched case-insensitively. A wrong email, a wrong password
        and a disabled user all return the same `401 invalid_credentials`,
        in similar time. A user with `must_change_password` signs in
        normally and must then call `POST /admin/me/password`.

        Over the failed-attempt limit for the client IP or the email, returns
        `429 rate_limited` without checking the password. A failure counts
        against both limits; a success clears the email's counter.

        Records `user.login` on success and `user.login_failed` (actor
        `anonymous`, with the email and a reason, never the password) on
        a wrong password, an unknown email or a disabled user.
      security:
        - csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Signed in; a new session replaces any previous one in this browser.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SessionCookies'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /admin/logout:
    post:
      tags: [admin-auth]
      operationId: adminLogout
      summary: Sign out
      description: |
        Deletes the session (when there is a valid one), expires
        `keipay_session` and sets a fresh `keipay_csrf`. Idempotent: without
        a valid session it still returns `204`. Records `user.logout` only
        when a session was ended. Allowed while `must_change_password` is
        true.
      security:
        - csrfToken: []
      responses:
        '204':
          description: Signed out.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SessionCookies'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /admin/me:
    get:
      tags: [admin-auth]
      operationId: getMe
      summary: The signed-in user
      description: Returns the user and their permissions. Allowed while `must_change_password` is true.
      responses:
        '200':
          description: The signed-in user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /admin/me/password:
    post:
      tags: [admin-auth]
      operationId: changeMyPassword
      summary: Change the signed-in user's password
      description: |
        Verifies `current_password`, sets the new one and clears
        `must_change_password`. Ends every other session of the user and
        replaces this one: the response sets a new `keipay_session` and
        `keipay_csrf`. A wrong current password returns
        `401 invalid_credentials` and keeps the session; a new password equal
        to the current one returns `400 validation_failed`. Records
        `user.change_password`. Allowed while `must_change_password` is true.
      security:
        - adminSession: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '200':
          description: Password changed; the session was replaced.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SessionCookies'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /admin/users:
    get:
      tags: [admin-users]
      operationId: listUsers
      summary: List users
      description: Cursor-paginated, newest first (`created_at` descending, then `id` descending). Includes disabled users.
      x-keipay-permission: users:manage
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of users.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [admin-users]
      operationId: createUser
      summary: Create a user
      description: |
        Creates an active user with a generated temporary password, returned
        in plaintext exactly once, and `must_change_password` true. A
        duplicate email (case-insensitive) returns `409 conflict`. Records
        `user.create`.
      x-keipay-permission: users:manage
      security:
        - adminSession: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: The user and their one-time temporary password.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserWithTemporaryPasswordResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /admin/users/{id}:
    get:
      tags: [admin-users]
      operationId: getUser
      summary: Get a user
      x-keipay-permission: users:manage
      parameters:
        - $ref: '#/components/parameters/UserIdPath'
      responses:
        '200':
          description: The user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      tags: [admin-users]
      operationId: updateUser
      summary: Update a user's email, name or role
      description: |
        Changes only the fields sent; at least one is required. Owners may
        edit themselves, including their role, as long as another active
        owner remains: a change that would leave no active owner returns
        `409 last_owner`. A role change applies to the user's next request
        without ending their sessions. A duplicate email returns
        `409 conflict`. Records `user.update` with the changed fields
        before and after; a request that changes nothing records nothing.
      x-keipay-permission: users:manage
      security:
        - adminSession: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/UserIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: The updated user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /admin/users/{id}/disable:
    post:
      tags: [admin-users]
      operationId: disableUser
      summary: Disable a user
      description: |
        Sets `disabled_at` and ends every session of the user at once; they
        can no longer sign in. Disabling yourself returns
        `409 cannot_modify_self`; disabling the last active owner returns
        `409 last_owner`. Idempotent: an already disabled user is returned
        unchanged and nothing is recorded. Records `user.disable`. Users are
        never hard-deleted, so the audit trail keeps resolving.
      x-keipay-permission: users:manage
      security:
        - adminSession: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/UserIdPath'
      responses:
        '200':
          description: The disabled user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /admin/users/{id}/enable:
    post:
      tags: [admin-users]
      operationId: enableUser
      summary: Enable a disabled user
      description: |
        Clears `disabled_at`; the user signs in again with their existing
        password. Idempotent: an active user is returned unchanged and
        nothing is recorded. Records `user.enable`.
      x-keipay-permission: users:manage
      security:
        - adminSession: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/UserIdPath'
      responses:
        '200':
          description: The enabled user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /admin/users/{id}/reset-password:
    post:
      tags: [admin-users]
      operationId: resetUserPassword
      summary: Reset a user's password
      description: |
        Replaces the password with a generated temporary password, returned
        in plaintext exactly once, sets `must_change_password` and ends
        every session of the user. Works on disabled users too (they stay
        disabled). Resetting your own password returns
        `409 cannot_modify_self`; use `POST /admin/me/password`. Records
        `user.reset_password`.
      x-keipay-permission: users:manage
      security:
        - adminSession: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/UserIdPath'
      responses:
        '200':
          description: The user and their one-time temporary password.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserWithTemporaryPasswordResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /admin/apps:
    get:
      tags: [admin-apps]
      operationId: listApps
      summary: List apps
      description: |
        Cursor-paginated, newest first (`created_at` descending, then `id`
        descending). Includes disabled apps unless filtered. An unknown
        `environment` or `status` returns `400 invalid_request` with rule
        `oneof`.
      x-keipay-permission: apps:read
      parameters:
        - name: environment
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/AppEnvironment'
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/AppStatus'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of apps.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [admin-apps]
      operationId: createApp
      summary: Create an app
      x-keipay-permission: apps:write
      security:
        - adminSession: []
          csrfToken: []
      description: |
        Creates an active app with its first API key (label `Default`, no
        expiry) and its webhook signing secret. The API key, API secret
        and webhook signing secret are returned in plaintext exactly once.
        `slug` must be unused within the environment (`409 conflict`);
        `slug` and `environment` never change. Records `app.create` and
        `api_key.create`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAppRequest'
      responses:
        '201':
          description: The app, its first key and the one-time secrets.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppCreatedResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /admin/apps/{id}:
    get:
      tags: [admin-apps]
      operationId: getApp
      summary: Get an app
      x-keipay-permission: apps:read
      parameters:
        - $ref: '#/components/parameters/AppIdPath'
      responses:
        '200':
          description: The app.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      tags: [admin-apps]
      operationId: updateApp
      summary: Update an app
      x-keipay-permission: apps:write
      security:
        - adminSession: []
          csrfToken: []
      description: |
        Send only the fields to change; `metadata` replaces the whole
        object. `slug` and `environment` cannot change: a body containing
        either returns `400 invalid_request` with rule `immutable` for that
        field, even with the current value. A body with none of the
        updatable fields returns `400 invalid_request` with
        `details.fields` `[{"field": "body", "rule": "required"}]`. Other
        unknown fields are ignored. A request that changes nothing returns
        the app and records nothing; otherwise it records `app.update`
        with only the changed fields.
      parameters:
        - $ref: '#/components/parameters/AppIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAppRequest'
      responses:
        '200':
          description: The app.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /admin/apps/{id}/disable:
    post:
      tags: [admin-apps]
      operationId: disableApp
      summary: Disable an app
      x-keipay-permission: apps:write
      security:
        - adminSession: []
          csrfToken: []
      description: |
        Every later `/v1` request with any of the app's keys gets
        `403 tenant_inactive`. Keys, payments and queued webhook forwards
        are unchanged. Disabling a disabled app returns it unchanged and
        records nothing; otherwise records `app.disable`.
      parameters:
        - $ref: '#/components/parameters/AppIdPath'
      responses:
        '200':
          description: The app.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /admin/apps/{id}/enable:
    post:
      tags: [admin-apps]
      operationId: enableApp
      summary: Enable an app
      x-keipay-permission: apps:write
      security:
        - adminSession: []
          csrfToken: []
      description: |
        Enabling an active app returns it unchanged and records nothing;
        otherwise records `app.enable`.
      parameters:
        - $ref: '#/components/parameters/AppIdPath'
      responses:
        '200':
          description: The app.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /admin/apps/{id}/keys:
    get:
      tags: [admin-apps]
      operationId: listAppApiKeys
      summary: List an app's API keys
      description: Cursor-paginated, newest first (`created_at` descending, then `id` descending). Includes revoked and expired keys.
      x-keipay-permission: apps:read
      parameters:
        - $ref: '#/components/parameters/AppIdPath'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of keys. Secrets and full keys are never returned here.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeyListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [admin-apps]
      operationId: createAppApiKey
      summary: Create an API key
      x-keipay-permission: apps:write
      security:
        - adminSession: []
          csrfToken: []
      description: |
        Issues a key in the app's environment. The key and its secret are
        returned in plaintext exactly once. An app may have at most 10
        usable (not revoked, not expired) keys; one more returns
        `400 validation_failed`. Works on disabled apps too. Records
        `api_key.create`.
      parameters:
        - $ref: '#/components/parameters/AppIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateApiKeyRequest'
      responses:
        '201':
          description: The key and its one-time secret.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeyCreatedResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /admin/apps/{id}/keys/{key_id}/rotate:
    post:
      tags: [admin-apps]
      operationId: rotateAppApiKey
      summary: Rotate an API key
      x-keipay-permission: apps:write
      security:
        - adminSession: []
          csrfToken: []
      description: |
        Issues a new key and secret with the same label and no expiry. The
        rotated key stays valid until it is revoked or expires, so both
        work while the app switches over. Rotating a revoked or expired
        key returns `400 validation_failed`; the 10-key limit applies. A
        key of another app returns `404 not_found`. Records
        `api_key.rotate` (target: the new key; before: the rotated key;
        after: the new key).
      parameters:
        - $ref: '#/components/parameters/AppIdPath'
        - $ref: '#/components/parameters/ApiKeyIdPath'
      responses:
        '201':
          description: The new key and its one-time secret.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeyCreatedResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /admin/apps/{id}/keys/{key_id}/revoke:
    post:
      tags: [admin-apps]
      operationId: revokeAppApiKey
      summary: Revoke an API key
      x-keipay-permission: apps:write
      security:
        - adminSession: []
          csrfToken: []
      description: |
        Revokes the key at once: later requests with it get
        `401 api_key_revoked`. Revoking the app's last usable key is
        allowed. Revoking a revoked key returns it unchanged and records
        nothing; otherwise records `api_key.revoke`. A key of another app
        returns `404 not_found`.
      parameters:
        - $ref: '#/components/parameters/AppIdPath'
        - $ref: '#/components/parameters/ApiKeyIdPath'
      responses:
        '200':
          description: The revoked key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeyResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /admin/payments:
    get:
      tags: [admin-payments]
      operationId: listAdminPayments
      summary: List payments
      x-keipay-permission: payments:read
      description: |
        Cursor-paginated, newest first (`created_at` descending, then `id`
        descending). Every filter is optional. An invalid value returns
        `400 invalid_request`: `app_id` rule `public_id`, `status` rule
        `oneof`, `from` or `to` rule `datetime`. An `app_id` that matches
        no app returns an empty page.
      parameters:
        - name: app_id
          in: query
          required: false
          description: Only payments of this app.
          schema:
            type: string
            pattern: '^app_[0-9A-HJKMNP-TV-Za-hjkmnp-tv-z]{26}$'
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/PaymentStatus'
        - $ref: '#/components/parameters/FromFilter'
        - $ref: '#/components/parameters/ToFilter'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of payments.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /admin/ledger:
    get:
      tags: [admin-payments]
      operationId: listLedger
      summary: List ledger entries with a per-app summary
      x-keipay-permission: payments:read
      description: |
        Offset-paginated, newest first. Unparseable filters are ignored, and
        an out-of-range `limit` falls back to the default. A well-formed
        `app_id` that matches no app returns no entries and an empty
        summary.
      parameters:
        - $ref: '#/components/parameters/AppIdFilter'
        - $ref: '#/components/parameters/FromFilter'
        - $ref: '#/components/parameters/ToFilter'
        - name: limit
          in: query
          required: false
          description: 1-500, default 100.
          schema:
            type: integer
            default: 100
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Ledger entries and per-app totals for the same filter.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LedgerListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /admin/webhook-deliveries:
    get:
      tags: [admin-webhooks]
      operationId: listWebhookDeliveries
      summary: List outbound webhook deliveries
      x-keipay-permission: deliveries:read
      description: |
        Offset-paginated, newest first. An unparseable `app_id` is
        ignored; a well-formed `app_id` that matches no app returns an
        empty list. An out-of-range `limit` falls back to the default.
      parameters:
        - $ref: '#/components/parameters/AppIdFilter'
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/WebhookDeliveryStatus'
        - name: limit
          in: query
          required: false
          description: 1-200, default 50.
          schema:
            type: integer
            default: 50
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: A page of deliveries.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /admin/webhook-deliveries/{id}/replay:
    post:
      tags: [admin-webhooks]
      operationId: replayWebhookDelivery
      summary: Replay a webhook delivery
      x-keipay-permission: deliveries:replay
      security:
        - adminSession: []
          csrfToken: []
      description: |
        Re-enqueues the delivery. Delivery is at-least-once, so apps must
        already dedupe. Recorded in the audit log as `webhook_delivery.replay`.
      parameters:
        - name: id
          in: path
          required: true
          description: Delivery id. A non-integer returns `400 invalid_request`; an integer below 1 matches nothing and returns `404 not_found`.
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '202':
          description: Re-enqueued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReplayResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /admin/audit-logs:
    get:
      tags: [admin-audit]
      operationId: listAuditLogs
      summary: List audit log entries
      x-keipay-permission: audit:read
      description: Cursor-paginated, newest first (`occurred_at` descending, then `id` descending).
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of audit entries.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLogListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

webhooks:
  paymentEvent:
    post:
      operationId: paymentEventWebhook
      summary: Payment event forwarded to the app's webhook_url
      description: |
        Sent when a payment changes status. Verify `X-Kei-Signature` (hex
        HMAC-SHA256 of the raw body keyed with the app's webhook signing
        secret; for apps that existed before apps replaced tenants, that is
        their original `api_secret`) in constant time. Return any `2xx` to
        acknowledge; anything else is retried. Delivery is at-least-once:
        dedupe on `payment_public_id` (or `payment_id`) + `event`.
      security: []
      parameters:
        - name: X-Kei-Event
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/PaymentEventType'
        - name: X-Kei-Signature
          in: header
          required: true
          schema:
            type: string
            pattern: '^[0-9a-f]{64}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentWebhookEvent'
      responses:
        '200':
          description: Acknowledged. Any 2xx status works.

components:
  securitySchemes:
    adminSession:
      type: apiKey
      in: cookie
      name: keipay_session
      description: |
        Session cookie set by `POST /admin/login` or `POST /admin/setup`.
        Missing: `401 session_required`. Unknown, idle, past its absolute
        lifetime, revoked, or its user disabled: `401 session_expired`.
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: |
        The current `keipay_csrf` cookie value. Required on every `POST`,
        `PUT`, `PATCH` and `DELETE` under `/admin/`, including sign-in,
        setup and logout; with a session it must equal the session's token.
        Missing or wrong: `403 invalid_csrf_token`.
    appApiKey:
      type: apiKey
      in: header
      name: X-Api-Key
      description: An app API key (`kp_test_…`, `kp_live_…`, or a legacy `kp_…`). Identifies the app; not a secret on its own.
    appTimestamp:
      type: apiKey
      in: header
      name: X-Timestamp
      description: Unix seconds; must be within 5 minutes of server time.
    appSignature:
      type: apiKey
      in: header
      name: X-Signature
      description: |
        Hex HMAC-SHA256 of `"{X-Timestamp}.{rawBody}"` keyed with the API
        secret of the key in `X-Api-Key`. Each signature is accepted once
        (replay protection).
    xenditCallbackToken:
      type: apiKey
      in: header
      name: x-callback-token
      description: The webhook verification token from the Xendit dashboard.

  parameters:
    UserIdPath:
      name: id
      in: path
      required: true
      description: |
        User id (`usr_…`; lower case is accepted). Any other format returns
        `400 invalid_request` with `details.fields` `[{"field": "id", "rule": "public_id"}]`.
      schema:
        type: string
        pattern: '^usr_[0-9A-HJKMNP-TV-Z]{26}$'
        examples: [usr_01JBKQ7Z8M4X2Y6V3N9T5R1W0C]
    PaymentIdPath:
      name: id
      in: path
      required: true
      description: |
        The payment's `pay_…` id (lower case accepted) or its legacy integer
        `payment_id`. Anything else returns `400 invalid_request` with
        `details.fields` `[{"field": "id", "rule": "public_id"}]`. A payment
        of another app, or an integer below 1, returns `404 not_found`.
      schema:
        type: string
        pattern: '^(pay_[0-9A-HJKMNP-TV-Za-hjkmnp-tv-z]{26}|[0-9]{1,19})$'
        examples: [pay_01JBKQ7Z8M4X2Y6V3N9T5R1W0C]
    AppIdPath:
      name: id
      in: path
      required: true
      description: |
        App id (`app_…`; lower case is accepted). Any other format returns
        `400 invalid_request` with `details.fields` `[{"field": "id", "rule": "public_id"}]`.
      schema:
        type: string
        pattern: '^app_[0-9A-HJKMNP-TV-Za-hjkmnp-tv-z]{26}$'
        examples: [app_01JBKQ7Z8M4X2Y6V3N9T5R1W0C]
    ApiKeyIdPath:
      name: key_id
      in: path
      required: true
      description: |
        API key id (`key_…`; lower case is accepted). Any other format
        returns `400 invalid_request` with `details.fields`
        `[{"field": "key_id", "rule": "public_id"}]`.
      schema:
        type: string
        pattern: '^key_[0-9A-HJKMNP-TV-Za-hjkmnp-tv-z]{26}$'
        examples: [key_01JBKQ7Z8M4X2Y6V3N9T5R1W0C]
    AppIdFilter:
      name: app_id
      in: query
      required: false
      description: Only rows of this app (`app_…`). On these legacy offset lists an unparseable value is ignored; a well-formed id that matches no app still filters, so no rows are returned.
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        Optional retry key, unique per app (see Idempotency). 1-255
        printable ASCII characters without spaces; an empty header counts as
        absent. Invalid: `400 invalid_request` with field `Idempotency-Key`
        and rule `max` (longer than 255) or `format`.
      schema:
        type: string
        minLength: 1
        maxLength: 255
        pattern: '^[\x21-\x7E]+$'
        examples: [3f1c2d9e-7b1a-4c55-9a1e-2f0f6f1b9c11]
    FromFilter:
      name: from
      in: query
      required: false
      description: Inclusive lower bound on `created_at` (RFC 3339).
      schema:
        type: string
        format: date-time
    ToFilter:
      name: to
      in: query
      required: false
      description: Inclusive upper bound on `created_at` (RFC 3339).
      schema:
        type: string
        format: date-time
    Offset:
      name: offset
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0
    Limit:
      name: limit
      in: query
      required: false
      description: Page size. Outside 1-200 returns `400 invalid_request`.
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque `next_cursor` from the previous page. A malformed cursor returns `400 invalid_cursor`.
      schema:
        type: string

  headers:
    SessionCookies:
      description: |
        `keipay_session` (session id, `HttpOnly`) and `keipay_csrf` (CSRF
        token, readable by scripts), both `SameSite=Lax; Path=/` and `Secure`
        unless `COOKIE_SECURE` resolves to false. On logout `keipay_session`
        is expired (`Max-Age=0`).
      schema:
        type: string
    RetryAfter:
      description: Seconds until the rate limit window ends.
      schema:
        type: integer
        minimum: 1
    IdempotentReplayed:
      description: '`true` when the response is an existing payment returned for a repeated `order_id` or `Idempotency-Key`; absent on a newly created payment.'
      schema:
        type: string
        const: 'true'

  responses:
    BadRequest:
      description: |
        `invalid_request` (malformed body, failed field validation, a
        non-integer path id, or a bad `limit` on a cursor-paginated list;
        `details.fields` lists offending fields), `validation_failed`
        (business validation), or `invalid_cursor`. The legacy
        offset-paginated lists ignore unparseable filters instead.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: |
        Authentication failed. The `code` says why: `session_required` or
        `session_expired` on admin routes, `invalid_credentials` on sign-in
        and password change, the app key and signature codes on `/v1`
        (including `api_key_revoked` and `api_key_expired`), and
        `invalid_callback_token` on gateway callbacks.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: |
        `forbidden` (the role lacks the operation's `x-keipay-permission`),
        `password_change_required`, `invalid_csrf_token`,
        `invalid_setup_token`, or on `/v1` `tenant_inactive` (the app is
        disabled).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: '`not_found`.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: |
        `conflict` (duplicate slug within an environment or duplicate
        email, or an `order_id` reused with a different amount or
        currency), `idempotency_key_reused`, `setup_completed`,
        `last_owner`, or `cannot_modify_self`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    TooManyRequests:
      description: '`rate_limited`: too many failed attempts. Retry after `Retry-After` seconds (also in `details.retry_after_seconds`).'
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: '`internal_error`. The message never contains internal details.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    ErrorCode:
      type: string
      description: |
        Stable machine-readable error code. New codes may be added; existing
        codes keep their meaning.

        | code | status | meaning |
        |---|---|---|
        | `invalid_request` | 400 | Malformed JSON, failed field validation, a non-integer path id, or a bad `limit` on a cursor-paginated list. `details.fields` is a list of `{field, rule}`. The legacy offset-paginated lists ignore unparseable query filters instead of rejecting them. |
        | `validation_failed` | 400 | The request is well-formed but breaks a business rule. |
        | `invalid_cursor` | 400 | The `cursor` is malformed or was not issued by this endpoint. |
        | `unauthorized` | 401 | Authentication failed for a reason not listed below. |
        | `invalid_credentials` | 401 | Wrong email or password (also returned for a disabled user), or wrong current password. |
        | `missing_token` | 401 | Not returned since admin bearer tokens were replaced by session cookies; kept so the code keeps its meaning. |
        | `invalid_token` | 401 | Not returned since admin bearer tokens were replaced by session cookies; kept so the code keeps its meaning. |
        | `session_required` | 401 | Admin request without a `keipay_session` cookie. |
        | `session_expired` | 401 | The session is unknown, idle too long, past its absolute lifetime, or was ended (logout, user disabled, password changed or reset). Sign in again. |
        | `missing_signature_headers` | 401 | App request without `X-Api-Key`, `X-Timestamp` or `X-Signature`. |
        | `invalid_timestamp` | 401 | `X-Timestamp` is not unix seconds. |
        | `timestamp_out_of_range` | 401 | `X-Timestamp` is more than 5 minutes from server time. |
        | `unknown_api_key` | 401 | No app key matches `X-Api-Key`. |
        | `api_key_revoked` | 401 | The key was revoked. Use another key of the app. |
        | `api_key_expired` | 401 | The key's `expires_at` has passed. Use another key of the app. |
        | `invalid_signature` | 401 | `X-Signature` does not match. |
        | `replayed_request` | 401 | This signature was already used. |
        | `invalid_callback_token` | 401 | Gateway callback token is missing or wrong. |
        | `tenant_inactive` | 403 | The app is disabled. (The name dates from when apps were called tenants.) |
        | `forbidden` | 403 | The signed-in user's role lacks the operation's permission (`x-keipay-permission`). |
        | `password_change_required` | 403 | The user must change their password first (`POST /admin/me/password`). |
        | `invalid_csrf_token` | 403 | `X-CSRF-Token` is missing, does not match the `keipay_csrf` cookie, or does not match the session. |
        | `invalid_setup_token` | 403 | The server requires `SETUP_TOKEN` and `setup_token` is missing or wrong. |
        | `not_found` | 404 | The resource or route does not exist. |
        | `conflict` | 409 | Duplicate (slug within an environment, email), or an `order_id` repeated with a different amount or currency. |
        | `idempotency_key_reused` | 409 | The `Idempotency-Key` was already used by this app for a different request. |
        | `setup_completed` | 409 | First-run setup already happened; sign in instead. |
        | `last_owner` | 409 | The change would leave no active owner. |
        | `cannot_modify_self` | 409 | Owners cannot disable themselves or reset their own password through the users API. |
        | `rate_limited` | 429 | Too many failed attempts. `details.retry_after_seconds` and the `Retry-After` header say when to retry. |
        | `internal_error` | 500 | Unexpected server error. |
      enum:
        - invalid_request
        - validation_failed
        - invalid_cursor
        - unauthorized
        - invalid_credentials
        - missing_token
        - invalid_token
        - missing_signature_headers
        - invalid_timestamp
        - timestamp_out_of_range
        - unknown_api_key
        - invalid_signature
        - replayed_request
        - invalid_callback_token
        - tenant_inactive
        - not_found
        - conflict
        - internal_error
        - session_required
        - session_expired
        - forbidden
        - password_change_required
        - invalid_csrf_token
        - invalid_setup_token
        - setup_completed
        - last_owner
        - cannot_modify_self
        - rate_limited
        - api_key_revoked
        - api_key_expired
        - idempotency_key_reused

    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, details]
          properties:
            code:
              $ref: '#/components/schemas/ErrorCode'
            message:
              type: string
              description: Human-readable; may change. Never contains secrets or internal errors.
            details:
              type: object
              description: Always present; empty unless the code documents keys.
              additionalProperties: true
              properties:
                fields:
                  type: array
                  description: Set for `invalid_request` caused by field validation.
                  items:
                    $ref: '#/components/schemas/FieldError'
                retry_after_seconds:
                  type: integer
                  minimum: 1
                  description: Set for `rate_limited`; same value as the `Retry-After` header.
      example:
        error:
          code: invalid_request
          message: invalid request body
          details:
            fields:
              - field: order_id
                rule: required

    FieldError:
      type: object
      additionalProperties: false
      required: [field, rule]
      properties:
        field:
          type: string
          description: JSON field name (dot path for nested fields).
          examples: [order_id, items.0.quantity]
        rule:
          type: string
          description: The failed rule, e.g. `required`, `min`, `gt`, `type`.

    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          const: ok

    PaymentStatus:
      type: string
      description: Normalized lifecycle. Status only moves forward (PENDING → PAID → SETTLED); a late success after EXPIRED or FAILED is still applied.
      enum: [PENDING, PAID, SETTLED, EXPIRED, FAILED]

    PaymentEventType:
      type: string
      enum: [payment.paid, payment.settled, payment.expired, payment.failed]

    OrderItem:
      type: object
      required: [name, quantity, price]
      properties:
        name:
          type: string
          minLength: 1
        quantity:
          type: integer
          format: int32
          minimum: 1
        price:
          type: integer
          format: int64
          minimum: 0
          description: Unit price in minor units of the payment currency.
        category:
          type: string
        reference_id:
          type: string
        url:
          type: string

    Customer:
      type: object
      properties:
        given_names:
          type: string
        surname:
          type: string
        email:
          type: string
        mobile_number:
          type: string

    CreatePaymentRequest:
      type: object
      required: [order_id, amount]
      properties:
        order_id:
          type: string
          minLength: 1
          description: Your order reference; unique per app.
        amount:
          type: integer
          format: int64
          minimum: 1
          description: Minor units of `currency` (for IDR, whole rupiah).
        currency:
          type: string
          default: IDR
          description: ISO 4217 code.
        description:
          type: string
        payer_email:
          type: string
        invoice_duration:
          type: integer
          description: Checkout lifetime in seconds. Zero or omitted uses the gateway default.
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
        customer:
          $ref: '#/components/schemas/Customer'
        expected_settlement_at:
          type: string
          format: date-time
          description: Optional estimate you can show your user before funds settle.
        metadata:
          $ref: '#/components/schemas/Metadata'

    PaymentResponse:
      type: object
      required: [id, payment_id, reference, order_id, status, amount, currency, invoice_url, metadata]
      properties:
        id:
          type: string
          pattern: '^pay_[0-9A-HJKMNP-TV-Z]{26}$'
          examples: [pay_01JBKQ7Z8M4X2Y6V3N9T5R1W0C]
        payment_id:
          type: integer
          format: int64
          description: Legacy integer id, kept for existing integrations. Prefer `id`.
        reference:
          type: string
          description: |
            The reference KeiPay sent to the gateway (Xendit `external_id`):
            `kp_` + `id` for payments created since apps replaced tenants,
            `{slug}:{order_id}` for older ones.
          examples: [kp_pay_01JBKQ7Z8M4X2Y6V3N9T5R1W0C]
        order_id:
          type: string
        status:
          $ref: '#/components/schemas/PaymentStatus'
        amount:
          type: integer
          format: int64
        currency:
          type: string
        invoice_url:
          type: string
          description: Hosted checkout URL to redirect the payer to.
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
        metadata:
          $ref: '#/components/schemas/Metadata'
        expires_at:
          type: string
          format: date-time
        paid_at:
          type: string
          format: date-time
        settled_at:
          type: string
          format: date-time
        expected_settlement_at:
          type: string
          format: date-time

    XenditInvoiceCallback:
      type: object
      description: The subset of the Xendit invoice callback KeiPay reads. Other fields are stored raw and ignored.
      required: [id, external_id, status]
      properties:
        id:
          type: string
        external_id:
          type: string
          description: The payment's reference, matched against stored references (`kp_pay_…`, or `{slug}:{order_id}` for older payments). It is never parsed.
        status:
          type: string
          examples: [PAID, SETTLED, EXPIRED]
        amount:
          type: integer
          format: int64
        currency:
          type: string
        paid_amount:
          type: integer
          format: int64
        fees_paid_amount:
          type: integer
          format: int64
        paid_at:
          type: string
        settlement_date:
          type: string
        updated:
          type: string
      additionalProperties: true

    ReceivedResponse:
      type: object
      required: [received]
      properties:
        received:
          type: boolean
          const: true

    UserRole:
      type: string
      description: |
        `owner` manages everything, including users. `admin` manages
        everything except users. `viewer` is read-only and cannot read the
        audit log.
      enum: [owner, admin, viewer]

    UserStatus:
      type: string
      description: '`disabled` exactly when `disabled_at` is set.'
      enum: [active, disabled]

    Permission:
      type: string
      description: See "Roles and permissions" above. New permissions may be added.
      enum:
        - 'apps:read'
        - 'apps:write'
        - 'payments:read'
        - 'deliveries:read'
        - 'deliveries:replay'
        - 'audit:read'
        - 'users:manage'

    Email:
      type: string
      format: email
      minLength: 3
      maxLength: 254
      description: |
        One address without a display name, for example `ops@example.com`.
        Unicode is allowed. KeiPay trims it, applies Unicode NFC and lower
        case, and stores that form, so emails are unique and matched
        case-insensitively. Invalid: `400 invalid_request` with rule `email`.
      examples: [ops@example.com]

    UserName:
      type: string
      minLength: 1
      maxLength: 100
      description: Display name, trimmed; blank after trimming is rejected (`required`).
      examples: [Ops Lead]

    NewPassword:
      type: string
      format: password
      minLength: 12
      maxLength: 72
      description: |
        At least 12 characters (Unicode code points) and at most 72 bytes as
        UTF-8, the bcrypt limit. Hashed exactly as sent, without trimming or
        normalization. Violations: `400 invalid_request` with rule `min` or
        `max`.

    User:
      type: object
      required: [id, email, name, role, status, must_change_password, disabled_at, last_login_at, created_at, updated_at]
      properties:
        id:
          type: string
          pattern: '^usr_[0-9A-HJKMNP-TV-Z]{26}$'
          examples: [usr_01JBKQ7Z8M4X2Y6V3N9T5R1W0C]
        email:
          type: string
          description: Stored (trimmed, NFC, lower-case) form.
        name:
          type: string
        role:
          $ref: '#/components/schemas/UserRole'
        status:
          $ref: '#/components/schemas/UserStatus'
        must_change_password:
          type: boolean
          description: True after an owner creates the user or resets their password, until the user changes it.
        disabled_at:
          type: [string, 'null']
          format: date-time
        last_login_at:
          type: [string, 'null']
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    MeResponse:
      type: object
      required: [user, permissions]
      properties:
        user:
          $ref: '#/components/schemas/User'
        permissions:
          type: array
          description: Everything the user's role allows, sorted. Hide what is not listed; the server enforces it anyway.
          items:
            $ref: '#/components/schemas/Permission'

    SetupStatusResponse:
      type: object
      required: [setup_required, setup_token_required]
      properties:
        setup_required:
          type: boolean
          description: True while no user exists.
        setup_token_required:
          type: boolean
          description: True when the server has `SETUP_TOKEN` set; then `POST /admin/setup` needs `setup_token`.

    SetupRequest:
      type: object
      required: [email, name, password]
      properties:
        email:
          $ref: '#/components/schemas/Email'
        name:
          $ref: '#/components/schemas/UserName'
        password:
          $ref: '#/components/schemas/NewPassword'
        setup_token:
          type: string
          maxLength: 256
          format: password
          description: Required when `setup_token_required` is true; ignored otherwise.

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          minLength: 1
          maxLength: 254
          description: Not format-checked here; a malformed email simply does not match (`401 invalid_credentials`).
        password:
          type: string
          minLength: 1
          maxLength: 1024
          format: password

    ChangePasswordRequest:
      type: object
      required: [current_password, new_password]
      properties:
        current_password:
          type: string
          minLength: 1
          maxLength: 1024
          format: password
        new_password:
          $ref: '#/components/schemas/NewPassword'

    CreateUserRequest:
      type: object
      required: [email, name, role]
      properties:
        email:
          $ref: '#/components/schemas/Email'
        name:
          $ref: '#/components/schemas/UserName'
        role:
          $ref: '#/components/schemas/UserRole'

    UpdateUserRequest:
      type: object
      minProperties: 1
      description: |
        Send only the fields to change; unknown fields are ignored. A body
        with none of these fields returns `400 invalid_request` with
        `details.fields` `[{"field": "body", "rule": "required"}]`.
      properties:
        email:
          $ref: '#/components/schemas/Email'
        name:
          $ref: '#/components/schemas/UserName'
        role:
          $ref: '#/components/schemas/UserRole'

    UserResponse:
      type: object
      required: [user]
      properties:
        user:
          $ref: '#/components/schemas/User'

    UserWithTemporaryPasswordResponse:
      type: object
      required: [user, temporary_password]
      properties:
        user:
          $ref: '#/components/schemas/User'
        temporary_password:
          type: string
          minLength: 20
          maxLength: 20
          description: |
            20 random characters from an alphabet without look-alikes
            (no `0 O 1 l I`). Shown once and never stored in plaintext; the
            user must change it at first sign-in.

    UserListResponse:
      type: object
      required: [data, next_cursor]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/User'
        next_cursor:
          type: [string, 'null']
          description: Pass as `cursor` to get the next page; `null` on the last page.

    AppEnvironment:
      type: string
      description: |
        `test` or `live`. Fixed when the app is created; the app's keys
        carry it (`kp_test_…`, `kp_live_…`).
      enum: [test, live]

    AppStatus:
      type: string
      description: '`disabled` apps get `403 tenant_inactive` on every `/v1` request.'
      enum: [active, disabled]

    AppSlug:
      type: string
      pattern: '^[a-z0-9][a-z0-9-]{1,30}[a-z0-9]$'
      description: |
        3-32 characters of `a-z`, `0-9` and `-`, starting and ending with a
        letter or digit (surrounding spaces are trimmed and upper case is
        lowered before checking). Unique within an environment; never
        changes. Invalid: rule `slug`.
      examples: [acme-shop]

    AppName:
      type: string
      minLength: 1
      maxLength: 100
      description: Display name, trimmed. Blank is rejected (`required`), more than 100 characters `max`, control characters `name`.
      examples: [Acme Shop]

    HttpUrl:
      type: string
      maxLength: 2048
      description: |
        Empty (none), or an absolute `http` or `https` URL with a host, at
        most 2048 bytes, without whitespace or control characters.
        Invalid: rule `url`.
      examples: [https://shop.example.com/hooks/keipay]

    Metadata:
      type: object
      maxProperties: 50
      propertyNames:
        minLength: 1
        maxLength: 40
      additionalProperties:
        type: [string, number, boolean, 'null']
        maxLength: 500
      description: |
        Your own key-value data, stored and returned with the same keys
        and values (key order is not kept; numbers are never rounded
        through floating point). At most 50 keys; each key 1-40
        characters (Unicode code points) without control characters; each
        value a string of at most 500 characters, a number, a boolean or
        `null` (no nested objects or arrays); no string may contain U+0000;
        at most 8192 bytes as compact JSON. Omitted or `null` means `{}`.
        Violations return `400 invalid_request` with `metadata` and rule
        `object` (not an object), `max_keys`, `key` or `max_bytes`, or with
        `metadata.<key>` and rule `type` (nested value), `max` (string too
        long) or `invalid_character` (U+0000).
      examples:
        - channel: mobile
          campaign: promo-11.11
          customer_tier: 2

    App:
      type: object
      required: [id, slug, name, environment, status, metadata, webhook_url, redirect_success_url, redirect_failure_url, created_at, updated_at]
      properties:
        id:
          type: string
          pattern: '^app_[0-9A-HJKMNP-TV-Z]{26}$'
          examples: [app_01JBKQ7Z8M4X2Y6V3N9T5R1W0C]
        slug:
          type: string
          description: See `AppSlug`. Never changes.
        name:
          type: string
        environment:
          $ref: '#/components/schemas/AppEnvironment'
        status:
          $ref: '#/components/schemas/AppStatus'
        metadata:
          $ref: '#/components/schemas/Metadata'
        webhook_url:
          type: string
          description: Where payment events are sent; empty means none.
        redirect_success_url:
          type: string
        redirect_failure_url:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    AppSummary:
      type: object
      description: The app a row belongs to.
      required: [id, slug, name, environment]
      properties:
        id:
          type: string
          pattern: '^app_[0-9A-HJKMNP-TV-Z]{26}$'
        slug:
          type: string
        name:
          type: string
        environment:
          $ref: '#/components/schemas/AppEnvironment'

    CreateAppRequest:
      type: object
      required: [name, slug, environment]
      properties:
        name:
          $ref: '#/components/schemas/AppName'
        slug:
          $ref: '#/components/schemas/AppSlug'
        environment:
          $ref: '#/components/schemas/AppEnvironment'
        webhook_url:
          $ref: '#/components/schemas/HttpUrl'
        redirect_success_url:
          $ref: '#/components/schemas/HttpUrl'
        redirect_failure_url:
          $ref: '#/components/schemas/HttpUrl'
        metadata:
          $ref: '#/components/schemas/Metadata'

    UpdateAppRequest:
      type: object
      minProperties: 1
      description: |
        Send only the fields to change. `slug` or `environment` in the body
        returns `400 invalid_request` with rule `immutable`.
      properties:
        name:
          $ref: '#/components/schemas/AppName'
        webhook_url:
          $ref: '#/components/schemas/HttpUrl'
        redirect_success_url:
          $ref: '#/components/schemas/HttpUrl'
        redirect_failure_url:
          $ref: '#/components/schemas/HttpUrl'
        metadata:
          $ref: '#/components/schemas/Metadata'

    AppResponse:
      type: object
      required: [app]
      properties:
        app:
          $ref: '#/components/schemas/App'

    AppListResponse:
      type: object
      required: [data, next_cursor]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/App'
        next_cursor:
          type: [string, 'null']
          description: Pass as `cursor` to get the next page; `null` on the last page.

    AppCreatedResponse:
      type: object
      required: [app, key, api_key, api_secret, webhook_secret]
      properties:
        app:
          $ref: '#/components/schemas/App'
        key:
          $ref: '#/components/schemas/ApiKey'
        api_key:
          type: string
          description: The full API key for `X-Api-Key`. Shown once; KeiPay keeps only its hash.
          examples: [kp_test_3f9a0c1d2e4b5a69788796a5b4c3d2e1]
        api_secret:
          type: string
          format: password
          description: The HMAC secret for `X-Signature`. Shown once; store it now.
        webhook_secret:
          type: string
          format: password
          description: The secret that signs outbound webhooks (`X-Kei-Signature`). Shown once; store it now.

    ApiKeyStatus:
      type: string
      description: Derived. `revoked` once `revoked_at` is set; else `expired` once `expires_at` has passed; else `active`.
      enum: [active, expired, revoked]

    ApiKeyLabel:
      type: string
      minLength: 1
      maxLength: 60
      description: What the key is for, trimmed. Blank is rejected (`required`), more than 60 characters `max`, control characters `name`.
      examples: [Production server]

    ApiKey:
      type: object
      required: [id, app_id, label, environment, prefix, last4, status, last_used_at, expires_at, revoked_at, created_at]
      properties:
        id:
          type: string
          pattern: '^key_[0-9A-HJKMNP-TV-Z]{26}$'
          examples: [key_01JBKQ7Z8M4X2Y6V3N9T5R1W0C]
        app_id:
          type: string
          pattern: '^app_[0-9A-HJKMNP-TV-Z]{26}$'
        label:
          type: string
        environment:
          $ref: '#/components/schemas/AppEnvironment'
        prefix:
          type: string
          enum: [kp_test_, kp_live_, kp_]
          description: '`kp_` for keys issued before apps replaced tenants. Display the key as `{prefix}…{last4}`.'
        last4:
          type: string
          minLength: 4
          maxLength: 4
        status:
          $ref: '#/components/schemas/ApiKeyStatus'
        last_used_at:
          type: [string, 'null']
          format: date-time
          description: Last successfully authenticated request; updated at most once a minute.
        expires_at:
          type: [string, 'null']
          format: date-time
        revoked_at:
          type: [string, 'null']
          format: date-time
        created_at:
          type: string
          format: date-time

    CreateApiKeyRequest:
      type: object
      required: [label]
      properties:
        label:
          $ref: '#/components/schemas/ApiKeyLabel'
        expires_at:
          type: [string, 'null']
          format: date-time
          description: Optional; must be in the future (rule `future`). Omitted or `null` means the key does not expire.

    ApiKeyResponse:
      type: object
      required: [key]
      properties:
        key:
          $ref: '#/components/schemas/ApiKey'

    ApiKeyListResponse:
      type: object
      required: [data, next_cursor]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ApiKey'
        next_cursor:
          type: [string, 'null']
          description: Pass as `cursor` to get the next page; `null` on the last page.

    ApiKeyCreatedResponse:
      type: object
      required: [key, api_key, api_secret]
      properties:
        key:
          $ref: '#/components/schemas/ApiKey'
        api_key:
          type: string
          description: The full API key for `X-Api-Key`. Shown once; KeiPay keeps only its hash.
        api_secret:
          type: string
          format: password
          description: The HMAC secret for `X-Signature`. Shown once; store it now.

    Payment:
      type: object
      required: [id, reference, app, order_id, xendit_invoice_id, amount, currency, status, description, invoice_url, payer_email, items, metadata, expires_at, paid_at, settled_at, expected_settlement_at, created_at, updated_at]
      properties:
        id:
          type: string
          pattern: '^pay_[0-9A-HJKMNP-TV-Z]{26}$'
          examples: [pay_01JBKQ7Z8M4X2Y6V3N9T5R1W0C]
        reference:
          type: string
          description: The gateway reference (Xendit `external_id`); `kp_pay_…`, or `{slug}:{order_id}` for older payments.
        app:
          $ref: '#/components/schemas/AppSummary'
        order_id:
          type: string
        xendit_invoice_id:
          type: string
        amount:
          type: integer
          format: int64
        currency:
          type: string
        status:
          $ref: '#/components/schemas/PaymentStatus'
        description:
          type: string
        invoice_url:
          type: string
        payer_email:
          type: string
        items:
          type: array
          description: Empty when the order had no items.
          items:
            $ref: '#/components/schemas/OrderItem'
        metadata:
          $ref: '#/components/schemas/Metadata'
        expires_at:
          type: [string, 'null']
          format: date-time
        paid_at:
          type: [string, 'null']
          format: date-time
        settled_at:
          type: [string, 'null']
          format: date-time
        expected_settlement_at:
          type: [string, 'null']
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    PaymentListResponse:
      type: object
      required: [data, next_cursor]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Payment'
        next_cursor:
          type: [string, 'null']
          description: Pass as `cursor` to get the next page; `null` on the last page.

    LedgerEntry:
      type: object
      required: [id, app, payment_id, amount, xendit_fee, net_amount, type, created_at]
      properties:
        id:
          type: integer
          format: int64
        app:
          $ref: '#/components/schemas/AppSummary'
        payment_id:
          type: string
          pattern: '^pay_[0-9A-HJKMNP-TV-Z]{26}$'
        amount:
          type: integer
          format: int64
        xendit_fee:
          type: integer
          format: int64
        net_amount:
          type: integer
          format: int64
        type:
          type: string
          enum: [PAYMENT, REFUND]
        settled_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time

    LedgerSummary:
      type: object
      required: [app, count, gross_amount, total_fee, net_amount]
      properties:
        app:
          $ref: '#/components/schemas/AppSummary'
        count:
          type: integer
          format: int64
        gross_amount:
          type: integer
          format: int64
        total_fee:
          type: integer
          format: int64
        net_amount:
          type: integer
          format: int64

    LedgerListResponse:
      type: object
      required: [entries, summary]
      properties:
        entries:
          type: array
          items:
            $ref: '#/components/schemas/LedgerEntry'
        summary:
          type: array
          items:
            $ref: '#/components/schemas/LedgerSummary'

    WebhookDeliveryStatus:
      type: string
      enum: [PENDING, DELIVERED, FAILED]

    WebhookDelivery:
      type: object
      required: [id, payment_id, app, event_type, payload, status, attempts, last_error, created_at, updated_at]
      properties:
        id:
          type: integer
          format: int64
        payment_id:
          type: string
          pattern: '^pay_[0-9A-HJKMNP-TV-Z]{26}$'
        app:
          $ref: '#/components/schemas/AppSummary'
        event_type:
          $ref: '#/components/schemas/PaymentEventType'
        payload:
          $ref: '#/components/schemas/PaymentWebhookEvent'
          description: The body as sent. Deliveries created before apps replaced tenants have no `payment_public_id` or `metadata`.
        status:
          $ref: '#/components/schemas/WebhookDeliveryStatus'
        attempts:
          type: integer
        last_error:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    DeliveryListResponse:
      type: object
      required: [deliveries]
      properties:
        deliveries:
          type: array
          items:
            $ref: '#/components/schemas/WebhookDelivery'

    ReplayResponse:
      type: object
      required: [requeued]
      properties:
        requeued:
          type: boolean
          const: true

    PaymentWebhookEvent:
      type: object
      required: [event, payment_id, order_id, external_id, status, amount, currency, timestamp]
      properties:
        event:
          $ref: '#/components/schemas/PaymentEventType'
        payment_id:
          type: integer
          format: int64
          description: Legacy integer id. Prefer `payment_public_id`.
        payment_public_id:
          type: string
          pattern: '^pay_[0-9A-HJKMNP-TV-Z]{26}$'
          description: The payment's `pay_…` id. Sent on every event since apps replaced tenants.
        order_id:
          type: string
        external_id:
          type: string
          description: The gateway reference (same as `reference` on the payment).
        metadata:
          $ref: '#/components/schemas/Metadata'
          description: The payment's `metadata`, `{}` when none. Sent on every event since apps replaced tenants.
        status:
          $ref: '#/components/schemas/PaymentStatus'
        amount:
          type: integer
          format: int64
        currency:
          type: string
        paid_at:
          type: string
          format: date-time
        settled_at:
          type: string
          format: date-time
        timestamp:
          type: string
          format: date-time

    AuditActor:
      type: object
      required: [type, id]
      properties:
        type:
          type: string
          description: |
            `admin` (a signed-in console user of any role), `system` (seed,
            CLI, setup, background job) or `anonymous` (a failed sign-in).
          examples: [admin, system, anonymous]
        id:
          type: string
          description: |
            The user's `usr_…` id for `admin`; the component name (`seed`,
            `cli`, `setup`) for `system`; `anonymous` for `anonymous`.
            Entries written before users existed carry the admin username.

    AuditTarget:
      type: object
      required: [type, id]
      properties:
        type:
          type: string
          description: Entries written before users existed use `admin_user` for the console admin; entries written before apps existed use `tenant` with the integer tenant id.
          examples: [app, api_key, user, webhook_delivery]
        id:
          type: string
          description: The target's identifier as a string (`app_…`, `key_…`, `usr_…`). Empty for a failed sign-in with an unknown email.

    AuditLog:
      type: object
      required: [id, occurred_at, actor, action, target, before, after, ip, user_agent, request_id]
      properties:
        id:
          type: string
          pattern: '^aud_[0-9A-HJKMNP-TV-Z]{26}$'
          examples: [aud_01JBKQ7Z8M4X2Y6V3N9T5R1W0C]
        occurred_at:
          type: string
          format: date-time
        actor:
          $ref: '#/components/schemas/AuditActor'
        action:
          type: string
          description: |
            `{target_type}.{verb}`. Current values: `app.create`,
            `app.update`, `app.disable`, `app.enable`, `api_key.create`,
            `api_key.rotate`, `api_key.revoke`, `webhook_delivery.replay`,
            `user.setup`, `user.create`, `user.update`, `user.disable`,
            `user.enable`, `user.reset_password`, `user.change_password`,
            `user.login`, `user.login_failed`, `user.logout`. Older entries
            may carry `tenant.create`, `tenant.update`,
            `tenant.rotate_credentials` or `admin_user.change_password`. New
            actions may be added.
          examples: [app.update]
        target:
          $ref: '#/components/schemas/AuditTarget'
        before:
          description: Snapshot before the change, without secrets; `null` on create.
          type: [object, 'null']
          additionalProperties: true
        after:
          description: Snapshot after the change, without secrets; `null` when nothing persistent changed.
          type: [object, 'null']
          additionalProperties: true
        ip:
          type: string
          description: Client IP, empty for system actors.
        user_agent:
          type: string
        request_id:
          type: string

    AuditLogListResponse:
      type: object
      required: [data, next_cursor]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AuditLog'
        next_cursor:
          type: [string, 'null']
          description: Pass as `cursor` to get the next page; `null` on the last page.

security:
  - adminSession: []
