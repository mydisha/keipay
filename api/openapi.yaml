      x-keipay-permission: apps:write
      security:
        - adminSession: []
          csrfToken: []
      description: |
        Every later `/v1` request with any of the app's keys gets
        `403 tenant_inactive`. Keys, payments and queued webhook forwards
        are unchanged. Disabling a disabled app returns it unchanged and
        records nothing; otherwise records `app.disable`.
      parameters:
        - $ref: '#/components/parameters/AppIdPath'
      responses:
        '200':
