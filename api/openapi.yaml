  /admin/apps/{id}/keys/{key_id}/rotate:
    post:
      tags: [admin-apps]
      operationId: rotateAppApiKey
      summary: Rotate an API key
      x-keipay-permission: apps:write
      security:
        - adminSession: []
          csrfToken: []
      description: |
