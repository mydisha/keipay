        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      tags: [admin-apps]
      operationId: updateApp
      summary: Update an app
      x-keipay-permission: apps:write
      security:
        - adminSession: []
          csrfToken: []
      description: |
        Send only the fields to change; `metadata` replaces the whole
        object. `slug` and `environment` cannot change: a body containing
        either returns `400 invalid_request` with rule `immutable` for that
        field, even with the current value. `webhook_url` returns
        `400 invalid_request` with rule `moved` (use webhook endpoints).
        A body with none of the
        updatable fields returns `400 invalid_request` with
        `details.fields` `[{"field": "body", "rule": "required"}]`. Other
        unknown fields are ignored. A request that changes nothing returns
        the app and records nothing; otherwise it records `app.update`
        with only the changed fields.

        `default_connection_id` sets (`con_…`) or clears (`null`) the
        connection `POST /v1/payments` uses. It returns
        `400 invalid_request` with field `default_connection_id` and rule
        `public_id` (malformed), `exists` (no such connection),
        `environment` (the connection's environment differs from the
        app's) or `status` (the connection is disabled).
      parameters:
        - $ref: '#/components/parameters/AppIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAppRequest'
      responses:
        '200':
          description: The app.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
