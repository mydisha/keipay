openapi: 3.1.0
info:
  title: KeiPay API
  version: 0.1.0
  summary: Self-hosted payment orchestrator.
  description: |
    KeiPay gives your apps one API and one credential for payment gateways.
    This document is the source of truth for the HTTP contract. Frontend
    types are generated from it (`make gen`); do not hand-write them.

    ## Surfaces

    - `/v1/*`: the app API, authenticated with an app API key and an
      HMAC-SHA256 signature (see App API keys).
    - `/webhooks/*`: inbound gateway callbacks, one URL per connection
      (`/webhooks/{provider}/{connection_id}`, see Connections). Every
      callback lives below `/webhooks/`; `GET /webhooks` itself is the
      console's Webhooks page.
    - `/admin/*`: the admin console API, authenticated with a session
      cookie and protected against CSRF (see Admin authentication).
    - `/healthz`: liveness.

    Every response carries an `X-Request-ID` header. Send your own
    `X-Request-ID` to correlate logs; otherwise KeiPay generates one.

    ## Errors

    Every error response, on every surface, has the same shape:

    ```json
    {"error": {"code": "not_found", "message": "not found", "details": {}}}
    ```

    `code` is stable and listed in `ErrorCode`; branch on it. `message` is
    for humans and may change. `details` is always an object; it is empty
    unless a code documents its keys.

    ## Pagination

    New list endpoints use cursor pagination: `limit` (1-200, default 50)
    and an opaque `cursor`; the response carries `data` and `next_cursor`
    (`null` on the last page). One older admin list (`/admin/ledger`)
    still uses `limit` and `offset` and moves to cursors when its feature
    is reworked.

    ## Identifiers

    Resources are identified by prefixed public ids: `app_…` (app),
    `key_…` (API key), `pay_…` (payment), `con_…` (gateway connection),
    `whe_…` (webhook endpoint), `evt_…` (event), `dlv_…` (webhook
    delivery), `inb_…` (inbound gateway webhook), `usr_…` (user),
    `aud_…` (audit entry). The part after the prefix is a ULID; lower
    case is accepted. Internal integer ids are not exposed, with two
    exceptions kept for existing integrations: the `payment_id` field of
    `/v1` payments and of version `v1` webhook bodies, and the ids of
    ledger entries.

    ## App API keys

    Each app has one environment, `test` or `live`, fixed at creation, and
    any number of API keys, at most 10 of them usable (not revoked, not
    expired) at a time. A key is an identifier plus a signing secret:

    - API key, sent as `X-Api-Key`: `kp_test_` or `kp_live_` (the app's
      environment) followed by 32 lower-case hex characters. Keys issued
      before apps replaced tenants keep their `kp_` + 32 hex form and act
      in their app's environment. KeiPay stores only a SHA-256 hash of the
      key and afterwards shows its prefix and last 4 characters.
    - API secret: `kps_test_` or `kps_live_` followed by 48 hex
      characters; the HMAC key for `X-Signature`. Stored encrypted.

    Both are shown once, when the key is created or rotated. The key
    alone decides the app and its environment; nothing in a request body
    or path can point at another app. A key stays usable until it is
    revoked or its optional `expires_at` passes. Rotating a key creates a
    new key and secret with the same label and leaves the old key valid
    until you revoke it: deploy the new pair, then revoke the old one.

    `/v1` checks, in order: the three headers, the timestamp window, the
    key (`401 unknown_api_key`), the signature (`401 invalid_signature`),
    then the key's state (`401 api_key_revoked`, `401 api_key_expired`)
    and the app's (`403 tenant_inactive` when the app is disabled), and
    finally replay (`401 replayed_request`). Key and app state are only
    reported to callers that signed with the key's secret.

    Outbound webhooks are signed with the secret of each webhook endpoint
    (see Webhooks to apps), never with an API secret, so rotating keys
    never breaks webhook verification.

    ## Idempotency

    `POST /v1/payments` is idempotent per `order_id` within the app.
    Optionally send `Idempotency-Key` as well (1-255 printable ASCII
    characters, no spaces). The key is checked first: the same key with
    the same request returns the original payment; the same key with a
    different request returns `409 idempotency_key_reused`. Without a key
    match, a repeated `order_id` with the same amount and currency returns
    the original payment, and with a different amount or currency
    `409 conflict`. Replays are answered with `201` and
    `Idempotent-Replayed: true`. Keys are stored with the payment and do
    not expire. Different apps may use the same `order_id` or key.

    ## Connections and providers

    A provider is a gateway adapter built into KeiPay (today: `xendit`).
    `GET /admin/providers` describes each one: its credential and
    settings fields (`ConfigSchema`), capabilities and webhook setup
    steps. The console renders its forms from that data, so a new
    provider needs no console change.

    A connection is one set of credentials for one gateway account, with
    an environment (`test` or `live`, the same vocabulary as apps), a
    name, provider settings and the channels it may offer. Credentials
    are validated against the provider's schema, encrypted at rest
    (envelope encryption: a random data key per connection, itself
    encrypted with the server's `ENCRYPTION_KEY`) and never returned:
    responses carry only the last 4 characters of each value (`null`
    when the value is shorter than 12 characters).

    Each app has an optional default connection with the same
    environment. `POST /v1/payments` creates the checkout on that
    connection; without one it returns `422 no_eligible_connection`.
    Multi-connection routing comes later and keeps this contract.

    Each connection has its own callback URL,
    `{HTTP_BASE_URL}/webhooks/{provider}/{connection_id}`, verified with
    that connection's credentials only: a callback signed for one
    connection and sent to another connection's URL is rejected.
    `POST /webhooks/xendit` remains as an alias for the connection
    imported from the deprecated `XENDIT_SECRET_KEY` and
    `XENDIT_CALLBACK_TOKEN` settings (see that operation).

    Every callback that reaches a known connection is recorded as an
    inbound webhook (`inb_…`): the raw body, whether verification passed,
    and what processing did with it (`InboundWebhookResult`). Read them
    with `GET /admin/inbound-webhooks`.

    ## Webhooks to apps

    KeiPay tells apps about payment changes by POSTing events to the
    app's webhook endpoints (`whe_…`, `/admin/apps/{id}/webhook-endpoints`).
    An app may have up to 10 endpoints. Each endpoint has a URL, the
    events it subscribes to, its own signing secret, optional custom
    headers, a retry policy and a body version.

    **Events.** `GET /admin/event-types` is the catalog: every event type
    with a description and an example. A subscription entry is an event
    type (`payment.paid`), a group wildcard (`payment.*`) or `*` (every
    event, including types added later). One event (`evt_…`) is created
    per payment change and fanned out as one delivery (`dlv_…`) per
    active endpoint whose subscriptions match, so each endpoint gets the
    same event id.

    **Body.** Endpoints with `api_version` `v2` (the default) receive the
    envelope `WebhookEnvelope`:
    `{"id": "evt_…", "type": "payment.paid", "api_version": "v2",
    "created_at": "…", "data": {…}}`. Fields are only ever added within a
    version; a breaking change gets a new `api_version`. Endpoints with
    `api_version` `v1` receive the older flat body `PaymentWebhookEvent`;
    only endpoints migrated from an app's former `webhook_url` start on
    `v1`.

    **Headers and signature.** Every request carries `Content-Type:
    application/json`, `User-Agent: KeiPay-Webhooks/1`,
    `X-KeiPay-Event-Id` (`evt_…`), `X-KeiPay-Event-Type`,
    `X-KeiPay-Delivery-Id` (`dlv_…`) and
    `X-KeiPay-Signature: t=<unix seconds>,v1=<hex>`, where `<hex>` is the
    HMAC-SHA256 of `"{t}.{raw body}"` keyed with the endpoint's signing
    secret (`kpwh_` + 48 hex characters). Test sends add
    `X-KeiPay-Test: true`. While a rotated secret is still in its overlap
    window the header carries one `v1=` per valid secret, newest first;
    accept the request when any of them matches. Reject a `t` more than 5
    minutes from your clock. Endpoints with `legacy_signature` also get
    `X-Kei-Event` and `X-Kei-Signature` (hex HMAC-SHA256 of the raw body,
    keyed with the current secret only); endpoints migrated from an app's
    `webhook_url` start with it on and keep that app's old signing
    secret, so existing receivers keep working.

    **Delivery.** At least once: dedupe on `X-KeiPay-Event-Id`. Any `2xx`
    within 15 seconds acknowledges; anything else, a redirect, or a
    timeout is a failed attempt, retried per the endpoint's
    `retry_policy`. A delivery whose attempts run out is `FAILED`. After
    `WEBHOOK_DISABLE_AFTER_FAILURES` (default 5) failed deliveries in a
    row the endpoint is disabled with `disabled_reason`
    `consecutive_failures`; enable it again with
    `POST /admin/webhook-endpoints/{id}/enable`. Replaying a delivery
    sends the same event id and body once more.

    ## Admin authentication

    On first run, while no user exists, `POST /admin/setup` creates the
    first owner. After that, users sign in with `POST /admin/login`. Both
    set two cookies:

    - `keipay_session`: an opaque session id. `HttpOnly`, `SameSite=Lax`,
      `Path=/`, no `Expires`, and `Secure` unless the server's
      `COOKIE_SECURE` resolves to false (it does by default only when
      `APP_ENV=development`). The session lives in Redis and ends after
      `SESSION_IDLE_TIMEOUT` (default 30m) without requests or
      `SESSION_ABSOLUTE_TIMEOUT` (default 12h) after sign-in, whichever
      comes first. Logging out, disabling the user, an owner resetting the
      user's password, and the user changing their password end the
      user's other sessions immediately.
    - `keipay_csrf`: the CSRF token, readable by scripts (not `HttpOnly`),
      same `SameSite`, `Path` and `Secure` rules. Every `/admin/*` response
      sets it when the request did not carry one; signing in, setup,
      changing the password and logging out replace it.

    Every `POST`, `PUT`, `PATCH` and `DELETE` under `/admin/` must send the
    current `keipay_csrf` value in the `X-CSRF-Token` header. With a valid
    session the header must also equal the token bound to that session.
    A missing or wrong token returns `403 invalid_csrf_token`. Fetch
    `GET /admin/setup` (public) first if the cookie is not set yet.

    A signed-in user whose `must_change_password` is true may only call
    `GET /admin/me`, `POST /admin/me/password` and `POST /admin/logout`;
    every other admin operation returns `403 password_change_required`.

    Failed sign-ins are rate limited per client IP (default 20) and per
    email (default 5) in a 15-minute window. Over the limit, login returns
    `429 rate_limited` with `Retry-After` before checking the password.
    The client IP is the TCP peer unless it is listed in `TRUSTED_PROXIES`.

    ## Roles and permissions

    Each user has one role. The server checks the permission named by an
    operation's `x-keipay-permission` and returns `403 forbidden` when the
    caller's role lacks it. Admin operations without the extension are open
    to every signed-in user, or public when their `security` is empty.

    | permission | owner | admin | viewer |
    |---|---|---|---|
    | `apps:read` | yes | yes | yes |
    | `apps:write` | yes | yes | no |
    | `connections:read` | yes | yes | yes |
    | `connections:write` | yes | yes | no |
    | `payments:read` | yes | yes | yes |
    | `deliveries:read` | yes | yes | yes |
    | `deliveries:replay` | yes | yes | no |
    | `audit:read` | yes | yes | no |
    | `users:manage` | yes | no | no |

    Webhook endpoints are app settings (`apps:read`, `apps:write`).
    `deliveries:read` covers both webhook logs: outbound deliveries and
    inbound gateway webhooks.

    `GET /admin/me` returns the caller's permissions, so clients never
    hard-code this table. New permissions may be added.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: /
    description: The KeiPay deployment serving this document (same origin).
tags:
  - name: health
    description: Liveness.
  - name: payments
    description: App API for payments.
  - name: gateway-webhooks
    description: Inbound callbacks from payment gateways.
  - name: admin-auth
    description: First-run setup, sign-in, sessions and the signed-in user's account.
  - name: admin-users
    description: Console users and roles (owner only).
  - name: admin-apps
    description: Apps, their API keys and settings.
  - name: admin-connections
    description: Gateway providers and connections (credentials, settings, channels).
  - name: admin-payments
    description: Payment and ledger reporting.
  - name: admin-webhooks
    description: Event catalog, webhook endpoints, outbound deliveries to apps and inbound gateway webhooks.
  - name: admin-audit
    description: Audit trail of admin mutations.

paths:
  /healthz:
    get:
      tags: [health]
      operationId: getHealth
      summary: Liveness probe
      security: []
      responses:
        '200':
          description: The process is up.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /v1/payments:
    post:
      tags: [payments]
      operationId: createPayment
      summary: Create a payment
      description: |
        Creates a hosted checkout on the gateway and returns its URL.
        Idempotent per `order_id` within the app, and per `Idempotency-Key`
        when sent (see Idempotency): a replay returns the original payment
        with `201` and `Idempotent-Replayed: true`; a repeated `order_id`
        with a different amount or currency returns `409 conflict`; a
        repeated `Idempotency-Key` with a different request returns
        `409 idempotency_key_reused`. An expired payment is returned as-is,
        so use a new `order_id` to retry.

        The gateway reference (`reference`, Xendit `external_id`) is
        `kp_` + the payment id, for example `kp_pay_01JB…`. `metadata` is
        stored with the payment, returned by `GET` and sent back in every
        webhook event for it.

        A body that breaks the schema, including any entry of `items` or
        `metadata`, returns `400 invalid_request` with `details.fields`
        (for example `items.0.quantity` or `metadata.note`).
        `400 validation_failed` is for business rules.

        The checkout is created on the app's default connection (see
        Connections and providers). Idempotent replays are answered before
        the connection is looked at, so they succeed even if the
        connection was changed since. Without a usable default connection
        the request returns `422 no_eligible_connection` with
        `details.reasons` (`["no_default_connection"]` or
        `["connection_disabled"]`). When the gateway refuses the request
        (validation, amount limits, credentials) it returns
        `422 provider_rejected`; when the gateway cannot be reached or
        answers with a server error it returns `503 provider_unavailable`.
        Neither creates a payment, so the same `order_id` may be retried.
      security:
        - appApiKey: []
          appTimestamp: []
          appSignature: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePaymentRequest'
      responses:
        '201':
          description: Payment created, or the existing payment for this `order_id` or `Idempotency-Key`.
          headers:
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /v1/payments/{id}:
    get:
      tags: [payments]
      operationId: getPayment
      summary: Get a payment
      description: Returns a payment of the calling app, by `pay_…` id or legacy integer id. Sign an empty body.
      security:
        - appApiKey: []
          appTimestamp: []
          appSignature: []
      parameters:
        - $ref: '#/components/parameters/PaymentIdPath'
      responses:
        '200':
          description: The payment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /webhooks/{provider}/{connection_id}:
    post:
      tags: [gateway-webhooks]
      operationId: receiveConnectionCallback
      summary: Receive a gateway callback for one connection
      description: |
        Paste this URL (shown as `webhook_url` on the connection) into the
        gateway dashboard. KeiPay resolves the connection by id, requires
        `provider` to equal the connection's provider, then verifies the
        callback with that connection's credentials before reading the
        body. For `xendit`, the `x-callback-token` header must equal the
        connection's `callback_token` (constant-time comparison).

        - Unknown connection id, malformed id, or a provider that differs
          from the connection's: `404 not_found`. Not recorded.
        - Verification fails: `401 invalid_callback_token`, logged as a
          security event and recorded as an inbound webhook with result
          `invalid_signature` (body cut to 4096 bytes). A token valid for
          another connection is still rejected.
        - Body is not valid JSON for the provider: `400 invalid_request`,
          recorded with result `invalid_payload`.
        - Duplicate (`duplicate`) and stale (`stale`) callbacks, callbacks
          with a gateway status KeiPay does not know (`unmapped`), callbacks
          whose amount or currency does not match the payment, and
          callbacks for a payment created through a different connection
          (both `mismatch`, logged as security events) are acknowledged
          with `200` and not applied, so the gateway stops retrying.
          Duplicates are detected per connection on the gateway's event
          key and status.
        - Real processing failures, including an unknown payment
          reference, return `500` (recorded as `error`) so the gateway
          retries.

        Disabled connections still accept callbacks, so payments created
        before disabling keep updating.
      security: []
      parameters:
        - name: provider
          in: path
          required: true
          description: The connection's provider.
          schema:
            $ref: '#/components/schemas/ProviderName'
        - name: connection_id
          in: path
          required: true
          description: The connection's `con_…` id (lower case is accepted). Any other format returns `404 not_found`.
          schema:
            type: string
            pattern: '^con_[0-9A-HJKMNP-TV-Za-hjkmnp-tv-z]{26}$'
            examples: [con_01JBKQ7Z8M4X2Y6V3N9T5R1W0C]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GatewayCallback'
      responses:
        '200':
          description: Accepted (applied, duplicate, stale or recorded mismatch).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReceivedResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /webhooks/xendit:
    post:
      tags: [gateway-webhooks]
      operationId: receiveXenditInvoiceCallback
      summary: Receive a Xendit invoice callback (legacy alias)
      deprecated: true
      description: |
        Alias of `/webhooks/xendit/{connection_id}` for the connection
        imported from the deprecated `XENDIT_SECRET_KEY` and
        `XENDIT_CALLBACK_TOKEN` settings (its `legacy_webhook_alias` is
        `true`), so a Xendit dashboard that still points here keeps
        working. Behaves exactly like the per-connection URL, including
        verification with that connection's `callback_token`. Returns
        `404 not_found` when no connection was imported. Point the Xendit
        dashboard at the connection's own `webhook_url` instead.
      security:
        - xenditCallbackToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/XenditInvoiceCallback'
      responses:
        '200':
          description: Accepted (applied, duplicate, stale or recorded mismatch).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReceivedResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /admin/setup:
    get:
      tags: [admin-auth]
      operationId: getSetupStatus
      summary: First-run setup status
      description: |
        Public. `setup_required` is true while no user exists. Like every
        `/admin/*` response it sets the `keipay_csrf` cookie when the request
        has none, so the console calls it before its first `POST`.
      security: []
      responses:
        '200':
          description: Setup status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetupStatusResponse'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [admin-auth]
      operationId: completeSetup
      summary: Create the first owner
      description: |
        Works only while no user exists; afterwards it returns
        `409 setup_completed`. Concurrent calls are serialized, so exactly
        one succeeds. Creates an active `owner` with the given password
        (`must_change_password` false), signs them in, and records
        `user.setup` (actor `system:setup`).

        When the server has `SETUP_TOKEN` set, `setup_token` must equal it;
        otherwise the call returns `403 invalid_setup_token` and counts as a
        failed attempt for the client IP. Checks run in this order: body
        (`400`), IP rate limit (`429`), already set up (`409`), setup token
        (`403`).
      security:
        - csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetupRequest'
      responses:
        '201':
          description: The owner exists and is signed in.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SessionCookies'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /admin/login:
    post:
      tags: [admin-auth]
      operationId: adminLogin
      summary: Sign in
      description: |
        Email is matched case-insensitively. A wrong email, a wrong password
        and a disabled user all return the same `401 invalid_credentials`,
        in similar time. A user with `must_change_password` signs in
        normally and must then call `POST /admin/me/password`.

        Over the failed-attempt limit for the client IP or the email, returns
        `429 rate_limited` without checking the password. A failure counts
        against both limits; a success clears the email's counter.

        Records `user.login` on success and `user.login_failed` (actor
        `anonymous`, with the email and a reason, never the password) on
        a wrong password, an unknown email or a disabled user.
      security:
        - csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Signed in; a new session replaces any previous one in this browser.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SessionCookies'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /admin/logout:
    post:
      tags: [admin-auth]
      operationId: adminLogout
      summary: Sign out
      description: |
        Deletes the session (when there is a valid one), expires
        `keipay_session` and sets a fresh `keipay_csrf`. Idempotent: without
        a valid session it still returns `204`. Records `user.logout` only
        when a session was ended. Allowed while `must_change_password` is
        true.
      security:
        - csrfToken: []
      responses:
        '204':
          description: Signed out.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SessionCookies'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /admin/me:
    get:
      tags: [admin-auth]
      operationId: getMe
      summary: The signed-in user
      description: Returns the user and their permissions. Allowed while `must_change_password` is true.
      responses:
        '200':
          description: The signed-in user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /admin/me/password:
    post:
      tags: [admin-auth]
      operationId: changeMyPassword
      summary: Change the signed-in user's password
      description: |
